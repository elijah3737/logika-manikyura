<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Логика маникюра — прототип</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0c4b38;--g2:#13644b;--cr:#f5f0e8;--cr2:#ece4d6;--ink:#1d2622;--mut:#6b746f;--line:#e2d9ca;--w:#fff;--gold:#c99a3c;--red:#b4452f}
*{box-sizing:border-box}body{margin:0;font-family:Onest,system-ui,sans-serif;background:var(--cr);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--g);text-decoration:none;cursor:pointer}button{font:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn:hover{background:var(--g2)}.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn.s{padding:6px 12px;font-size:13px}.btn.gold{background:var(--gold)}
.demo{background:#1d2622;color:#cfd6d2;font-size:12.5px;padding:6px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo b{color:#f1c24b}.demo button{background:#2f3a35;color:#fff;border:0;border-radius:6px;padding:3px 9px;font-size:12px}
header.top{background:var(--w);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hin{max-width:1180px;margin:auto;display:flex;align-items:center;gap:22px;padding:12px 16px}
.logo{font-weight:700;color:var(--g);font-size:18px;white-space:nowrap}.logo span{color:var(--gold)}
nav.m{display:flex;gap:18px;flex:1;flex-wrap:wrap}nav.m a{color:var(--ink);font-size:14.5px}nav.m a.on{color:var(--g);font-weight:600}
.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}
h1{font-size:34px;line-height:1.15;margin:0 0 12px}h2{font-size:24px;margin:34px 0 14px}h3{margin:0 0 6px;font-size:17px}
.mut{color:var(--mut)}.sm{font-size:13px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;background:var(--g);color:#fff;border-radius:22px;padding:40px}
.hero p{color:#d6e4dc;font-size:17px}.hero .ph{aspect-ratio:4/3;border-radius:16px;background:linear-gradient(135deg,#2c7a5f,#0a3a2b);display:grid;place-items:center;color:#9cc7b3;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--g);transform:translateY(-2px)}
.thumb{aspect-ratio:16/9;border-radius:10px;background:var(--cr2);display:grid;place-items:center;color:var(--mut);font-size:12px;margin-bottom:6px;position:relative}
.kind{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--gold)}
.price{font-weight:700;color:var(--g);margin-top:auto}.lock{position:absolute;top:8px;right:8px;background:#fff;border-radius:20px;padding:2px 8px;font-size:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.chip{border:1px solid var(--line);background:var(--w);border-radius:20px;padding:6px 14px;font-size:13.5px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.box{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:20px}
.two{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.art{background:var(--w);border-radius:14px;padding:32px;border:1px solid var(--line)}.art p{font-size:16.5px;line-height:1.65}
.art .vid{aspect-ratio:16/9;background:#1d2622;border-radius:12px;display:grid;place-items:center;color:#aaa;margin:18px 0}
.fade{position:relative}.fade:after{content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,#fff)}
.gate{background:var(--cr);border-radius:14px;padding:24px;text-align:center;margin-top:10px}
.upsell{border-top:1px solid var(--line);margin-top:24px;padding-top:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.form{max-width:420px;margin:30px auto}.form input,.form textarea,.form select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 12px;background:#fff}
.chk{display:flex;gap:8px;font-size:13px;align-items:flex-start;margin:6px 0}.chk input{width:auto;margin-top:4px}
/* кабинет */
.lk{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.side{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:10px;position:sticky;top:76px}
.side a{display:flex;justify-content:space-between;padding:9px 12px;border-radius:9px;color:var(--ink);font-size:14.5px}.side a.on{background:var(--cr);color:var(--g);font-weight:600}
.side .sep{border-top:1px solid var(--line);margin:8px 0}
.bar{height:8px;background:var(--cr2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat .box b{font-size:26px;color:var(--g);display:block}
/* плеер */
.pl{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.tree{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:76px}
.tree .mod{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:12px 6px 4px}
.tree a{display:flex;gap:8px;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink)}.tree a.on{background:var(--cr)}
.st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px;color:#fff}
.st.done{background:var(--g);border-color:var(--g)}.st.half{border-color:var(--gold);background:linear-gradient(90deg,var(--gold) 50%,transparent 50%)}
.video{aspect-ratio:16/9;background:#141a17;border-radius:14px;position:relative;display:grid;place-items:center;color:#8a9;overflow:hidden}
.video .play{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:26px;color:#fff}
.wm{position:absolute;color:rgba(255,255,255,.13);font-size:14px;transform:rotate(-18deg);pointer-events:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 12px;flex-wrap:wrap}.tabs button{background:none;border:0;padding:9px 14px;border-bottom:2px solid transparent;color:var(--mut)}
.tabs button.on{border-color:var(--g);color:var(--g);font-weight:600}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}.star.on{background:#fff4d8;border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mut);text-transform:uppercase;font-weight:600}
.pill{font-size:11.5px;border-radius:10px;padding:2px 8px;background:var(--cr)}.pill.g{background:#dcefe5;color:var(--g)}.pill.r{background:#f7dfd9;color:var(--red)}.pill.y{background:#fff1cf;color:#8a6414}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:20;display:none}
footer{border-top:1px solid var(--line);padding:24px 16px;color:var(--mut);font-size:13px;text-align:center}
.bread{font-size:13px;color:var(--mut);margin-bottom:12px}
@media(max-width:900px){.hero,.two,.lk,.pl{grid-template-columns:1fr}.side,.tree{position:static;max-height:none}.stat{grid-template-columns:1fr}.hin{flex-wrap:wrap;gap:10px}nav.m{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:16px;padding-bottom:4px}nav.m a{white-space:nowrap}#acc{margin-left:auto}h1{font-size:27px}.hero{padding:24px}.art{padding:18px}}
</style></head><body>
<div class="demo"><b>ПРОТОТИП</b> данные тестовые · войти как:
<button onclick="demo('new')">новичок</button><button onclick="demo('club')">участник клуба</button><button onclick="demo('salon')">руководитель салона</button><button onclick="demo('admin')">Катя (админ)</button><button onclick="demo('out')">выйти</button></div>
<header class="top"><div class="hin"><a class="logo" href="#/">Логика <span>маникюра</span></a>
<nav class="m" id="nav"></nav><div id="acc"></div></div></header>
<main id="app"></main>
<footer>© Логика маникюра · Политика конфиденциальности · Оферта · Согласие на обработку ПДн</footer>
<div class="toast" id="toast"></div>
<script>
/* ---------- тестовые данные ---------- */
const ATOMS=[["a1","Как не сделать больно, отодвигая кутикулу","Кутикула",9,99],["a2","Как выбрать фрезу для шлифовки среза","Фрезы",12,199],["a3","Как не перепилить ноготь при снятии","Снятие",11,199],["a4","Угол фрезы: почему остаются «ступеньки»","Фрезы",8,99],["a5","Боковые валики без порезов","Кутикула",10,199],["a6","Снятие гель-лака за 7 минут","Снятие",7,99],["a7","Идеальный квадрат: геометрия формы","Форма",13,199],["a8","Миндаль без перекоса","Форма",12,199],["a9","Выравнивание базой: сколько капель","Покрытие",14,199],["a10","Покрытие под кутикулу без затеков","Покрытие",15,199],["a11","Дезинфекция и стерилизация по СанПиН","Гигиена",10,99],["a12","Как держать руку клиента, чтобы не уставала спина","Эргономика",6,99]];
const P={};ATOMS.forEach(([id,t,topic,d,pr])=>P[id]={id,kind:"Атом",title:t,topic,price:pr+" ₽",sub:true,desc:"Базовый мини-урок по одной узкой теме. Разобрано медленно, крупно, с ошибками и как их исправить.",mods:[{t:"Урок",ls:[[id+"-1",t,d+" мин"]]}],files:["Шпаргалка (PDF)"]});
const mk=(id,n,names)=>names.map((m,i)=>({t:m[0],ls:m[1].map((l,j)=>[id+"-"+i+"-"+j,l,(8+((i*3+j*7)%20))+" мин"])}));
P.kombi={id:"kombi",kind:"Курс",title:"Комби-маникюр с нуля",price:"X ₽",desc:"Главный курс: от постановки руки до чистого комби-маникюра на модели за 1,5 часа. 6 модулей, отработки, разборы работ.",mods:mk("kombi",0,[["Постановка и инструменты",["Рабочее место","Как держать аппарат","Фрезы: какие нужны на старте"]],["Кутикула",["Анатомия зоны","Отодвигаем без боли","Срез: ножницы или фреза","Боковые валики"]],["Снятие",["Снятие гель-лака","Снятие наращивания","Ошибки при снятии"]],["Форма",["Квадрат","Миндаль","Овал"]],["Покрытие",["Выравнивание","Под кутикулу","Топ без липкого слоя"]],["Итоговая работа",["Модель 1: разбор","Модель 2: разбор","Как сдать отработку"]]]),files:["Чек-лист рабочего места","Схема фрез","Рабочая тетрадь"]};
P.sub={id:"sub",kind:"Подписка",title:"Подписка «Логика маникюра»",price:"X ₽/мес",desc:"Все атомы платформы + 4 новых урока на моделях каждый месяц + записи эфиров. Отмена в один клик.",mods:mk("sub",0,[["Сентябрь: уроки на моделях",["Модель: тонкие ногти, отслойки","Модель: сухая кутикула","Эфир: как поднять чек","Модель: миндаль на коротких"]],["Август: уроки на моделях",["Модель: вросший валик","Модель: френч","Эфир: ответы на вопросы","Модель: квадрат на широких"]]]),files:["Схема «Модель: отслойки»"]};
P.club={id:"club",kind:"Клуб",title:"Клуб (архив)",price:"Для участников",desc:"Прежний клуб Кати: все записанные уроки и эфиры. Участники получают доступ к подписке и атомам.",mods:mk("club",0,[["Техника",["Разбор аппаратного маникюра","Разбор комби"]],["Эфиры клуба",["Эфир: цены в 2026","Эфир: соцсети мастера","Эфир: выгорание"]]]),files:["Прайс-шаблон"]};
P.models={id:"models",kind:"Урок на модели",title:"Модель: тонкие ногти и отслойки",price:"299 ₽",sub:true,desc:"Комплексная работа на модели. По мелочам — ссылки на атомы.",mods:[{t:"Урок",ls:[["models-1","Работа на модели целиком","42 мин"]]}],files:["Схема подготовки"]};
const ARTS=[["ar1","Почему после маникюра болит палец: 5 причин","Кутикула"],["ar2","Какие фрезы нужны мастеру на старте","Фрезы"],["ar3","Комби-маникюр или аппаратный: что выбрать","Техника"],["ar4","Сколько стоит маникюр в 2026 и как поднять цену","Бизнес"],["ar5","Отслойки гель-лака: 7 причин и решения","Покрытие"],["ar6","Стерилизация инструмента: пошагово","Гигиена"]];
const KB=[["k1","Разбор: кутикула за 3 движения","Кутикула",0],["k2","Карусель: 6 ошибок при снятии","Снятие",0],["k3","Видео: как поставить руку","Постановка",0],["k4","Урок с BeautyDay: безопасный комби (20 мин)","Техника",1],["k5","Чек-лист «Рабочее место мастера»","Гигиена",1],["k6","Гайд по фрезам: таблица","Фрезы",1],["k7","Разбор: квадрат на коротких ногтях","Форма",0],["k8","Шаблон прайса для мастера","Бизнес",1]];
const EVENTS=[["e1","Эфир: как перестать бояться фрезы","2 октября, 19:00","free"],["e2","Вебинар: как мастеру выйти на 150 000 ₽","9 октября, 19:00","free"],["e3","Эфир для подписчиков: разбор ваших работ","16 октября, 19:00","sub"]];
const TOPICS=["Все","Кутикула","Фрезы","Снятие","Форма","Покрытие","Гигиена","Эргономика"];
/* ---------- состояние ---------- */
const def={role:null,name:"",email:"",owned:[],prog:{},half:{},notes:[],stars:[],points:0,gift:null,sub:null,hist:[],prof:{}};
let S;try{S=JSON.parse(localStorage.getItem("lm_state"))||{...def}}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem("lm_state",JSON.stringify(S))}catch(e){}};
const lessons=p=>p.mods.flatMap(m=>m.ls);
const has=id=>S.role&&(S.owned.includes(id)||(S.sub&&P[id]&&P[id].sub)||(S.sub&&id=="sub")||S.role=="admin");
function demo(r){S=JSON.parse(JSON.stringify(def));if(r=="out"){save();go("#/");return}
S.role=r=="admin"?"admin":"user";S.salon=r=="salon";
if(r=="new"){S.name="Аня";S.email="anya@mail.ru";S.points=50;S.hist=[["+50","Регистрация"]];go("#/gift");save();return}
if(r=="club"){S.name="Марина";S.email="marina@mail.ru";S.owned=["club","kombi","a2"];S.sub="до 23 октября";S.points=340;S.hist=[["+100","Отзыв о курсе"],["+40","Оценки 4 уроков"],["+200","Приглашённая купила курс"]];
lessons(P.kombi).slice(0,11).forEach(l=>S.prog[l[0]]=1);S.half[lessons(P.kombi)[11][0]]=1;S.notes=[{l:"kombi-1-1",t:"Угол 45°, не давить!",d:"12.09"},{l:"kombi-2-2",t:"Пересмотреть перед моделью",d:"18.09"}];S.stars=["kombi-1-1","kombi-3-0"]}
if(r=="salon"){S.name="Салон «Ноготок»";S.email="nogotok@mail.ru";S.sub="корп. до 1 ноября"}
if(r=="admin"){S.name="Катя";S.email="katya@turkeeva.ru"}
save();go(r=="admin"?"#/admin":r=="salon"?"#/salon":"#/lk")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)}
let CUR=location.hash||"#/";const go=h=>{CUR=h;try{if(location.hash!=h)history.pushState(null,"",h)}catch(e){}render()};
/* ---------- куски ---------- */
const card=p=>`<div class="card" onclick="go('#/p/${p.id}')"><div class="thumb">${p.kind=="Атом"?"▶ "+lessons(p)[0][2]:"обложка"}${has(p.id)?'<span class="lock">✓ доступ</span>':''}</div><span class="kind">${p.kind}</span><h3>${p.title}</h3>${p.sub&&p.kind!="Подписка"?'<span class="sm mut">входит в подписку</span>':''}<span class="price">${has(p.id)?"Смотреть →":p.price}</span></div>`;
const artCard=a=>`<div class="card" onclick="go('#/a/${a[0]}')"><div class="thumb">фото</div><span class="kind">${a[2]}</span><h3>${a[1]}</h3><span class="sm mut">6 мин чтения</span></div>`;
const kbCard=k=>`<div class="card" onclick="go('#/kb/${k[0]}')"><div class="thumb">${k[1].split(":")[0]}${k[3]&&!S.role?'<span class="lock">🔒 после регистрации</span>':''}</div><span class="kind">${k[2]}</span><h3>${k[1]}</h3></div>`;
const atomsBy=t=>ATOMS.filter(a=>a[2]==t).map(a=>P[a[0]]);
const upsell=t=>{const l=atomsBy(t);return l.length?`<div class="upsell"><h3>Эта тема подробнее — в атомах</h3><p class="sm mut">Короткие уроки по одной теме</p>${l.map(p=>`<div class="row"><a onclick="go('#/p/${p.id}')">${p.title}</a>${has(p.id)?'<a class="btn s o" onclick="go(\'#/learn/'+p.id+'\')">Смотреть</a>':`<a class="btn s" onclick="buy('${p.id}')">${p.price}</a>`}</div>`).join("")}</div>`:""};
function buy(id){if(!S.role){S.after="#/checkout/"+id;save();return go("#/register")}go("#/checkout/"+id)}
/* ---------- страницы: сайт ---------- */
const R={};
R[""]=()=>`<div class="hero"><div><span class="kind" style="color:#f1c24b">Катя Туркеева · nail-педагог</span><h1>Маникюр, в котором понятна логика каждого движения</h1><p>Статьи, короткие уроки-атомы по 99 ₽ и подписка с разборами на моделях. Первый урок — в подарок.</p><a class="btn gold" onclick="go('${S.role?"#/lk":"#/register"}')">${S.role?"В кабинет":"Получить урок бесплатно"}</a> <a class="btn o" style="color:#fff;border-color:#fff" onclick="go('#/catalog')">Смотреть обучение</a></div><div class="ph">фото Кати</div></div>
<h2>Атомы — по 99–199 ₽</h2><div class="grid">${["a1","a2","a3","a7"].map(i=>card(P[i])).join("")}</div>
<h2>Обучение</h2><div class="grid">${["sub","kombi","models"].map(i=>card(P[i])).join("")}</div>
<h2>Статьи</h2><div class="grid">${ARTS.slice(0,3).map(artCard).join("")}</div>
<h2>Ближайшие эфиры</h2><div class="grid">${EVENTS.slice(0,2).map(e=>`<div class="card" onclick="go('#/events')"><span class="kind">${e[2]}</span><h3>${e[1]}</h3><span class="sm mut">Бесплатно, нужна регистрация</span></div>`).join("")}</div>
<h2>Для салонов</h2><div class="box two"><div><h3>Корпоративный доступ для мастеров</h3><p class="mut">Оплачиваете подписку на команду, видите, кто что прошёл и сдал ли отработки.</p></div><a class="btn" onclick="go('#/salons')">Подробнее</a></div>`;
R.articles=()=>`<h1>Статьи</h1><p class="mut">Отвечаем на вопросы, которые мастера задают поисковику.</p><div class="grid">${ARTS.map(artCard).join("")}</div>`;
R.a=id=>{const a=ARTS.find(x=>x[0]==id)||ARTS[0];return`<div class="bread"><a onclick="go('#/articles')">Статьи</a> / ${a[2]}</div><div class="two"><div class="art"><span class="kind">${a[2]}</span><h1>${a[1]}</h1><p class="mut sm">Катя Туркеева · 6 мин чтения</p><p>Боль после маникюра почти всегда связана не с «чувствительной кожей», а с техникой: углом инструмента, давлением и тем, в какой момент мастер переходит к срезу. Разберём пять причин по порядку.</p><h3>1. Слишком сильное давление при отодвигании</h3><p>Кутикулу не нужно «продавливать». Достаточно лёгкого движения под углом 30–45°, чтобы приподнять птеригий…</p><div class="art vid">▶ видео из блога (встроено)</div><h3>2. Неправильный угол фрезы</h3><p>Если фреза стоит слишком круто, она задевает живую кожу у валика…</p>${upsell(a[2]=="Техника"?"Кутикула":a[2])}</div><aside class="box"><h3>Подарок</h3><p class="sm">Зарегистрируйтесь и выберите любой атом бесплатно.</p><a class="btn" onclick="go('#/register')">Выбрать урок</a><h3 style="margin-top:20px">Ещё статьи</h3>${ARTS.filter(x=>x[0]!=id).slice(0,4).map(x=>`<div class="row"><a onclick="go('#/a/${x[0]}')">${x[1]}</a></div>`).join("")}</aside></div>`};
R.kb=()=>{const t=S.kbt||"Все";return`<h1>База знаний</h1><p class="mut">Разборы из блога с подробным текстом. 🔒 — открывается бесплатно после регистрации.</p><div class="chips">${["Все","Кутикула","Снятие","Форма","Фрезы","Техника","Гигиена","Бизнес"].map(x=>`<button class="chip ${x==t?"on":""}" onclick="S.kbt='${x}';render()">${x}</button>`).join("")}</div><div class="grid">${KB.filter(k=>t=="Все"||k[2]==t).map(kbCard).join("")}</div>`};
R.kbitem=id=>{const k=KB.find(x=>x[0]==id)||KB[0];const locked=k[3]&&!S.role;return`<div class="bread"><a onclick="go('#/kb')">База знаний</a> / ${k[2]}</div><div class="art" style="max-width:820px"><span class="kind">${k[2]}</span><h1>${k[1]}</h1>${locked?`<div class="fade"><p>В этом разборе — пошагово, со скринами из видео: какие движения делать, в каком порядке и где мастера чаще всего ошибаются. Начнём с подготовки…</p></div><div class="gate"><h3>🔒 Бесплатно после регистрации</h3><p class="sm mut">Регистрация — 30 секунд. Плюс любой атом в подарок.</p><a class="btn" onclick="S.after='#/kb/${id}';save();go('#/register')">Зарегистрироваться</a> <a class="btn o" onclick="S.after='#/kb/${id}';save();go('#/login')">Войти</a></div>`:`<div class="art vid">▶ видео из блога</div><p>Шаг 1. Размягчаем кутикулу… Шаг 2. Лёгким движением под углом 45° приподнимаем… Шаг 3. Проверяем валики…</p><p>Скрины из видео с пояснениями — здесь.</p>${k[3]?'<p><a class="btn s o" onclick="toast(\'Файл скачан (прототип)\')">Скачать PDF</a></p>':""}${upsell(k[2])}`}</div>`};
R.catalog=()=>{const t=S.ct||"Всё";const f={"Всё":()=>1,"Атомы":p=>p.kind=="Атом","Уроки на моделях":p=>p.kind=="Урок на модели","Курсы":p=>p.kind=="Курс","Подписка":p=>p.kind=="Подписка"||p.kind=="Клуб"}[t];const tp=S.tp||"Все";
return`<h1>Обучение</h1><p class="mut">Атомы — базовые уроки по одной теме. Уроки на моделях — комплексная работа. Подписка — всё вместе.</p><div class="box two" style="margin:14px 0;background:var(--g);color:#fff"><div><h3>Подписка: все атомы + 4 урока на моделях в месяц</h3><span class="sm" style="color:#cfe0d6">Отмена в один клик</span></div><a class="btn gold" onclick="go('#/p/sub')">Подробнее</a></div><div class="chips">${["Всё","Атомы","Уроки на моделях","Курсы","Подписка"].map(x=>`<button class="chip ${x==t?"on":""}" onclick="S.ct='${x}';render()">${x}</button>`).join("")}</div>${t=="Атомы"?`<div class="chips">${TOPICS.map(x=>`<button class="chip ${x==tp?"on":""}" onclick="S.tp='${x}';render()">${x}</button>`).join("")}</div>`:""}<div class="grid">${Object.values(P).filter(f).filter(p=>t!="Атомы"||tp=="Все"||p.topic==tp).map(card).join("")}</div>`};
R.p=id=>{const p=P[id];if(!p)return R[""]();const n=lessons(p).length;return`<div class="bread"><a onclick="go('#/catalog')">Обучение</a> / ${p.kind}</div><div class="two"><div><div class="video"><div class="play">▶</div><span style="position:absolute;bottom:12px;left:14px;font-size:13px">Трейлер: что внутри · 1:20</span></div><span class="kind" style="display:block;margin-top:16px">${p.kind}</span><h1>${p.title}</h1><p>${p.desc}</p><h2>Программа</h2>${p.mods.map((m,i)=>`<div class="box" style="margin-bottom:10px"><h3>${p.mods.length>1?"Модуль "+(i+1)+". ":""}${m.t}</h3>${m.ls.map(l=>`<div class="row"><span>${l[1]}</span><span class="sm mut">${l[2]}</span></div>`).join("")}</div>`).join("")}<h2>Материалы</h2><p class="mut">${p.files.join(" · ")}</p></div>
<aside class="box" style="position:sticky;top:76px"><div class="price" style="font-size:26px">${p.price}</div><p class="sm mut">${n} ${n==1?"урок":"уроков"} · доступ бессрочно${p.kind=="Подписка"?" пока активна подписка":""}</p>${has(id)?`<a class="btn" style="width:100%;text-align:center" onclick="go('#/learn/${id}')">Смотреть</a>`:`<a class="btn" style="width:100%;text-align:center" onclick="buy('${id}')">Купить</a>${p.sub&&p.kind!="Подписка"?`<p class="sm" style="margin-top:12px">или <a onclick="go('#/p/sub')">всё это в подписке →</a></p>`:""}${S.points?`<p class="sm mut">Можно оплатить баллами: у вас ${S.points}</p>`:""}`}</aside></div>`};
R.events=()=>`<h1>Эфиры и вебинары</h1><p class="mut">Бесплатные — по регистрации. Записи уходят в подписку.</p>${EVENTS.map(e=>`<div class="box row" style="margin-bottom:10px"><div><span class="kind">${e[2]}</span><h3>${e[1]}</h3>${e[3]=="sub"?'<span class="pill y">для подписчиков</span>':'<span class="pill g">бесплатно</span>'}</div><a class="btn" onclick="${S.role?`toast('Вы записаны, напомним на почту')`:`S.after='#/events';save();go('#/register')`}">Записаться</a></div>`).join("")}<h2>Записи прошедших</h2><div class="grid">${lessons(P.sub).filter(l=>l[1].startsWith("Эфир")).map(l=>`<div class="card" onclick="go('#/learn/sub/${l[0]}')"><div class="thumb">▶ запись</div><h3>${l[1]}</h3><span class="sm mut">в подписке</span></div>`).join("")}</div>`;
R.salons=()=>`<div class="hero"><div><span class="kind" style="color:#f1c24b">Для салонов и студий</span><h1>Обучайте мастеров и видьте, кто что прошёл</h1><p>Одна подписка на команду. У каждого мастера свой кабинет, у руководителя — прогресс всех.</p><a class="btn gold" onclick="go('#/salonform')">Оставить заявку</a></div><div class="ph">скрин кабинета руководителя</div></div><h2>Как это работает</h2><div class="grid">${[["1. Покупаете места","Подписка на 5, 10 или 20 мастеров"],["2. Добавляете мастеров","По почте, заменить можно в любой момент"],["3. Назначаете уроки","Что пройти к какому сроку"],["4. Смотрите прогресс","Кто сколько прошёл, сдал ли отработку"]].map(x=>`<div class="box"><h3>${x[0]}</h3><p class="mut sm">${x[1]}</p></div>`).join("")}</div><h2>Тарифы</h2><div class="grid">${[5,10,20].map(n=>`<div class="box"><h3>${n} мастеров</h3><div class="price">X ₽/мес</div><a class="btn s" style="margin-top:10px" onclick="go('#/salonform')">Выбрать</a></div>`).join("")}</div>`;
R.salonform=()=>`<div class="form box"><h1 style="font-size:24px">Заявка салона</h1><input placeholder="Название салона"><input placeholder="Город"><input placeholder="Сколько мастеров"><input placeholder="Телефон или Телеграм"><label class="chk"><input type="checkbox" checked> Согласен на обработку персональных данных</label><a class="btn" onclick="toast('Заявка отправлена');go('#/')">Отправить</a></div>`;
/* ---------- вход ---------- */
R.register=()=>`<div class="form box"><h1 style="font-size:26px">Регистрация</h1><p class="mut sm">Откроются закрытые материалы, а один атом — в подарок.</p><input placeholder="Имя" id="rn" value="Аня"><input placeholder="Почта" id="re" value="anya@mail.ru"><label class="chk"><input type="checkbox" id="rc"> Даю согласие на обработку персональных данных и принимаю <a>политику</a></label><label class="chk"><input type="checkbox"> Хочу получать письма о новых уроках (необязательно)</label><button class="btn" style="width:100%" onclick="reg()">Получить код на почту</button><p class="sm mut" style="text-align:center">Уже есть аккаунт? <a onclick="go('#/login')">Войти</a></p></div>`;
function reg(){if(!document.getElementById("rc").checked)return toast("Без согласия на обработку данных регистрация невозможна");const n=document.getElementById("rn").value,e=document.getElementById("re").value;S={...JSON.parse(JSON.stringify(def)),after:S.after};S.role="user";S.name=n;S.email=e;S.points=50;S.hist=[["+50","Регистрация"]];save();go("#/code")}
R.code=()=>`<div class="form box"><h1 style="font-size:24px">Введите код</h1><p class="sm mut">Отправили 4 цифры на ${S.email||"почту"}</p><input value="1234" style="letter-spacing:.5em;font-size:22px;text-align:center"><button class="btn" style="width:100%" onclick="go(S.gift?(S.after||'#/lk'):'#/gift')">Войти</button></div>`;
R.login=()=>`<div class="form box"><h1 style="font-size:26px">Вход</h1><p class="sm mut">Участники клуба с GetCourse — входите по той же почте, доступы перенесены.</p><input placeholder="Почта" value="marina@mail.ru"><button class="btn" style="width:100%" onclick="S.email||demo('club');go('#/code')">Получить код</button><p class="sm mut" style="text-align:center">Нет аккаунта? <a onclick="go('#/register')">Регистрация</a></p></div>`;
R.gift=()=>`<h1>🎁 Выберите урок в подарок</h1><p class="mut">Любой атом — бесплатно и навсегда.</p><div class="grid">${ATOMS.map(a=>`<div class="card" onclick="pickGift('${a[0]}')"><div class="thumb">▶ ${a[3]} мин</div><span class="kind">${a[2]}</span><h3>${a[1]}</h3><span class="price">Выбрать</span></div>`).join("")}</div>`;
function pickGift(id){S.gift=id;S.owned.push(id);save();toast("Подарок ваш!");const a=S.after;S.after=null;save();go(a||"#/learn/"+id)}
R.checkout=id=>{const p=P[id];return`<div class="form box" style="max-width:480px"><h1 style="font-size:24px">Оплата</h1><div class="row"><span>${p.title}</span><b>${p.price}</b></div>${S.points?`<label class="chk"><input type="checkbox"> Списать баллы (${S.points})</label>`:""}<input placeholder="Промокод"><input placeholder="Номер карты" value="4242 4242 4242 4242"><label class="chk"><input type="checkbox" checked> Сохранить карту для оплаты в 1 клик</label>${p.kind=="Подписка"?'<label class="chk"><input type="checkbox" checked> Согласен на автопродление, отменить можно в кабинете одной кнопкой</label>':""}<button class="btn" style="width:100%" onclick="pay('${id}')">Оплатить ${p.price}</button><p class="sm mut">ЮKassa · чек придёт на почту</p></div>`};
function pay(id){if(id=="sub")S.sub="до 23 октября";else S.owned.push(id);S.points+=10;S.hist.unshift(["+10","Покупка: "+P[id].title]);save();toast("Оплачено, доступ открыт");go("#/learn/"+id)}
/* ---------- кабинет ---------- */
const lkMenu=[["lk","Главная"],["courses","Мои курсы"],["notes","Заметки и метки"],["files","Полезные файлы"],["sub","Подписка и платежи"],["points","Баллы"],["ref","Рефералка"],["profile","Анкета"]];
const LK=(k,body)=>S.role?`<div class="lk"><nav class="side"><div style="padding:8px 12px"><b>${S.name}</b><div class="sm mut">${S.email}</div></div><div class="sep"></div>${lkMenu.map(m=>`<a class="${m[0]==k?"on":""}" onclick="go('#/${m[0]=="lk"?"lk":"lk/"+m[0]}')">${m[1]}${m[0]=="points"?`<span class="pill y">${S.points}</span>`:""}</a>`).join("")}<div class="sep"></div><a onclick="go('#/catalog')">Витрина →</a><a onclick="toast('Сообщество — в Телеграм-чате подписчиков')">Сообщество ↗</a></nav><div>${body}</div></div>`:`<div class="form box"><h3>Нужно войти</h3><a class="btn" onclick="go('#/login')">Войти</a></div>`;
const myProds=()=>Object.values(P).filter(p=>S.owned.includes(p.id)||(S.sub&&p.id=="sub"));
const pct=p=>{const l=lessons(p);return[l.filter(x=>S.prog[x[0]]).length,l.length]};
const progCard=p=>{const[a,b]=pct(p);return`<div class="card" onclick="go('#/learn/${p.id}')"><span class="kind">${p.kind}</span><h3>${p.title}</h3><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div><span class="sm mut">${a} из ${b} уроков</span></div>`};
function nextLesson(){for(const p of myProds()){const l=lessons(p).find(x=>!S.prog[x[0]]);if(l)return[p,l]}return null}
R.lk=()=>{const nx=nextLesson();const mine=myProds();return LK("lk",`<h1>Привет, ${S.name}!</h1>${nx?`<div class="box two" style="background:var(--g);color:#fff;margin-bottom:18px"><div><span class="sm" style="color:#cfe0d6">Продолжить с того места</span><h3>${nx[1][1]}</h3><span class="sm" style="color:#cfe0d6">${nx[0].title}</span></div><a class="btn gold" onclick="go('#/learn/${nx[0].id}/${nx[1][0]}')">▶ Смотреть</a></div>`:""}<div class="stat"><div class="box"><span class="sm mut">Подписка</span><b>${S.sub?"активна":"нет"}</b><span class="sm">${S.sub?S.sub+" · <a onclick=\"go('#/lk/sub')\">продлить</a>":"<a onclick=\"go('#/p/sub')\">оформить →</a>"}</span></div><div class="box"><span class="sm mut">Пройдено уроков</span><b>${Object.keys(S.prog).length}</b></div><div class="box"><span class="sm mut">Баллы</span><b>${S.points}</b><a class="sm" onclick="go('#/lk/points')">как заработать →</a></div></div><h2>Мои курсы</h2>${mine.length?`<div class="grid">${mine.map(progCard).join("")}</div>`:`<p class="mut">Пока пусто. <a onclick="go('#/gift')">Выберите подарок</a></p>`}<h2>Вам может пригодиться</h2><div class="grid">${Object.values(P).filter(p=>p.kind=="Атом"&&!has(p.id)).slice(0,4).map(card).join("")}</div>`)};
R["lk/courses"]=()=>LK("courses",`<h1>Мои курсы</h1><div class="grid">${myProds().map(progCard).join("")||'<p class="mut">Пока ничего не куплено</p>'}</div><h2>Можно купить</h2><div class="grid">${Object.values(P).filter(p=>!has(p.id)).map(card).join("")}</div>`);
const lname=id=>{for(const p of Object.values(P))for(const l of lessons(p))if(l[0]==id)return[p,l];return[P.kombi,lessons(P.kombi)[0]]};
R["lk/notes"]=()=>LK("notes",`<h1>Заметки и метки</h1><h2>⭐ Отмеченные уроки</h2>${S.stars.map(id=>{const[p,l]=lname(id);return`<div class="row"><a onclick="go('#/learn/${p.id}/${id}')">${l[1]}</a><span class="sm mut">${p.title}</span></div>`}).join("")||'<p class="mut">Пока нет</p>'}<h2>📝 Мои заметки</h2>${S.notes.map(n=>{const[p,l]=lname(n.l);return`<div class="box" style="margin-bottom:10px"><p style="margin:0 0 6px">${n.t}</p><span class="sm mut">${n.d} · </span><a class="sm" onclick="go('#/learn/${p.id}/${n.l}')">${l[1]} →</a></div>`}).join("")||'<p class="mut">Заметки пишутся прямо под уроком</p>'}`);
R["lk/files"]=()=>LK("files",`<h1>Полезные файлы</h1><p class="mut">Собираются из уроков, к которым у вас есть доступ.</p><table><tr><th>Файл</th><th>Из урока</th><th></th></tr>${myProds().flatMap(p=>p.files.map(f=>`<tr><td>📄 ${f}</td><td><a onclick="go('#/learn/${p.id}')">${p.title}</a></td><td><a class="btn s o" onclick="toast('Скачано (прототип)')">Скачать</a></td></tr>`)).join("")||'<tr><td colspan=3 class="mut">Пока нет</td></tr>'}</table>`);
R["lk/sub"]=()=>LK("sub",`<h1>Подписка и платежи</h1><div class="box">${S.sub?`<h3>Подписка активна</h3><p>Продлится ${S.sub.replace("до ","")} · X ₽/мес · карта •• 4242</p><a class="btn o s" onclick="S.sub=null;save();toast('Подписка отменена, доступ до конца периода');render()">Отменить подписку</a>`:`<h3>Подписки нет</h3><a class="btn" onclick="go('#/p/sub')">Оформить</a>`}</div><h2>История оплат</h2><table><tr><th>Дата</th><th>Что</th><th>Сумма</th><th>Чек</th></tr><tr><td>23.09</td><td>Подписка</td><td>X ₽</td><td><a>чек</a></td></tr><tr><td>02.09</td><td>Атом: Как выбрать фрезу</td><td>199 ₽</td><td><a>чек</a></td></tr></table>`);
