<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Логика маникюра — прототип v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tf:#0ABAB5;--tf2:#09A8A3;--tfd:#0A8481;--tq:#5EEAD4;--tint:#E6F8F7;--tint2:#CDF1EF;--ink:#171717;--ch:#1e2022;--mut:#6e6e73;--mut2:#86868b;--bg:#fff;--bg2:#f5f5f7;--line:#e8e8ed;--red:#d92d20;--redbg:#fde8e6;--amb:#a15c00;--ambbg:#fff3df;--grn:#0f7a5a;--grnbg:#e2f5ec;--sh:0 4px 20px rgba(0,0,0,.04);--sh2:0 14px 40px rgba(0,0,0,.09);--r:24px;--rm:13px;--rs:6px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--tfd);text-decoration:none;cursor:pointer}button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}h1{font-size:40px;line-height:1.1;font-weight:700}h2{font-size:28px;line-height:1.2;font-weight:700}h3{font-size:20px;line-height:1.25;font-weight:600}h4{font-size:16px;font-weight:600}
p{margin:0}.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12px}.b{font-weight:600}
.kick{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tfd)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}svg.i.f{fill:currentColor;stroke:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--tf);color:#062a29;border:1px solid transparent;border-radius:var(--rm);padding:13px 24px;font-size:15px;font-weight:600;min-height:50px;transition:.15s;white-space:nowrap;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--tf2);transform:translateY(-1px)}
.btn.dk{background:var(--ch);color:#fff}.btn.dk:hover{background:#000}
.btn.o{background:#fff;color:var(--ch);border-color:var(--line)}.btn.o:hover{background:var(--bg2);border-color:#cfcfd4}
.btn.gh{background:transparent;color:var(--tfd)}.btn.gh:hover{background:var(--tint)}
.btn.s{padding:9px 16px;min-height:40px;font-size:14px}.btn.xs{padding:6px 12px;min-height:32px;font-size:13px;border-radius:9px}.btn.w{width:100%}
.lnk{color:var(--ch);font-size:14px;font-weight:500}.lnk:hover{color:var(--tfd)}
.card{background:#fff;border-radius:var(--r);padding:26px;box-shadow:var(--sh)}
.hov{cursor:pointer;transition:.2s}.hov:hover{box-shadow:var(--sh2);transform:translateY(-3px)}
.dark{background:var(--ch);color:#fff}.dark .mut{color:#a1a1a6}.dark a.lnk{color:#fff}
.wrap{max-width:1200px;margin:auto;padding:0 24px}
.sec{padding:80px 0}.sec.g{background:var(--bg2)}.sec h2{margin-bottom:8px}.sec .lead{color:var(--mut);font-size:18px;margin-bottom:36px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}.shead .lead{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c2{grid-template-columns:repeat(2,1fr)}

.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}.seg button{border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;color:var(--mut);transition:.15s}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500}.chip.on{background:var(--ch);color:#fff;border-color:var(--ch)}
/* шапка сайта */
.demo{background:#101112;color:#9a9ca1;font-size:12.5px;padding:7px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.demo b{color:var(--tq);margin-right:6px}.demo button{background:#26282c;color:#fff;border-radius:999px;padding:4px 11px;font-size:12px}.demo button:hover{background:var(--tf);color:#062a29}
.hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
.hin{display:flex;align-items:center;gap:32px;height:60px}

.nav{display:flex;gap:26px;flex:1;justify-content:center}.nav a{color:var(--ch);font-size:14px;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}.nav a.on{border-color:var(--tf)}.nav a:hover{color:var(--tfd)}
.hr{display:flex;gap:14px;align-items:center;margin-left:auto}

.hero h1{font-size:56px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:16px 0 20px}.hero h1 em{font-style:normal;color:var(--tf)}
.hero p.lead{font-size:20px;color:var(--mut);margin-bottom:32px;line-height:1.45}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.trust{display:flex;gap:22px;margin-top:28px;color:var(--mut);font-size:14px;flex-wrap:wrap}.trust b{color:var(--ink);font-size:20px;display:block;letter-spacing:-.02em}
.mock{background:var(--bg2);border-radius:32px;padding:28px;position:relative}
.mock .pl{background:#fff;border-radius:20px;box-shadow:var(--sh2);overflow:hidden}.mock .v{aspect-ratio:16/9;background:linear-gradient(135deg,#0c3f3d,#0ABAB5 70%,#5EEAD4);position:relative;display:grid;place-items:center}
.play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.mock .pb{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.float{position:absolute;background:#fff;border-radius:16px;box-shadow:var(--sh2);padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px}.float.a{left:-28px;bottom:-30px}.float.b{right:-18px;top:36px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-8px}
.tile{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--tfd);display:grid;place-items:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}.steps:before{content:"";position:absolute;left:8%;right:8%;top:28px;border-top:2px dashed var(--line)}
.step{position:relative;padding:0 24px;text-align:center}.step .n{width:56px;height:56px;border-radius:50%;background:var(--ch);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin:0 auto 16px;position:relative;box-shadow:0 0 0 8px #fff}.step.t .n{background:var(--tf);color:#062a29}
.cov{aspect-ratio:16/10;border-radius:16px;position:relative;display:grid;place-items:center;color:#fff;overflow:hidden}.cov .dur{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}.cov .lock{position:absolute;top:10px;left:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;display:flex;gap:5px;align-items:center}
.cov .play{width:48px;height:48px}
.pc{display:flex;flex-direction:column;gap:10px;padding:14px}.pc h3{font-size:17px}.pc .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}.price{font-weight:700;font-size:17px}
.subban{border-radius:32px;padding:56px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}.subban h2{font-size:40px;letter-spacing:-.03em;line-height:1.1}.subban ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}.subban li{display:flex;gap:10px;align-items:center}.subban li svg{color:var(--tq)}
.artc{display:flex;flex-direction:column;gap:12px}.artc .cov{aspect-ratio:16/9}
.evrow{display:flex;align-items:center;gap:24px;padding:22px 26px}.evrow .d{width:64px;text-align:center;flex:none}.evrow .d b{font-size:26px;display:block;line-height:1;letter-spacing:-.02em}.evrow .d span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
footer{padding:48px 0 32px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}.fcols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;margin-bottom:32px}.fcols a{display:block;color:var(--ch);margin:6px 0}

.fade{position:relative;max-height:150px;overflow:hidden}.fade:after{content:"";position:absolute;inset:auto 0 0 0;height:100px;background:linear-gradient(transparent,#fff)}
.gate{background:var(--bg2);border-radius:20px;padding:32px;text-align:center;margin-top:12px}
.bread{font-size:14px;color:var(--mut);margin-bottom:16px;display:flex;gap:8px;align-items:center}.bread a{color:var(--mut)}.bread a:hover{color:var(--tfd)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.row:last-child{border-bottom:0}
.form{max-width:460px;margin:56px auto}.form h1{font-size:30px;margin-bottom:6px}
.inp,input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--rm);font:inherit;font-size:15px;background:#fff;color:var(--ink);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--tf);box-shadow:0 0 0 3px var(--tint2)}
label.l{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.chk{display:flex;gap:10px;font-size:13.5px;align-items:flex-start;margin:12px 0;color:var(--mut)}.chk input{width:18px;height:18px;margin-top:2px;padding:0;accent-color:var(--tf)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tg{width:44px;height:26px;border-radius:999px;background:#d1d1d6;position:relative;flex:none;transition:.2s}.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.tg.on{background:var(--tf)}.tg.on:after{left:21px}
.upsell{border-top:1px solid var(--line);margin-top:28px;padding-top:22px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}tr:last-child td{border-bottom:0}
.bar{height:6px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tf);border-radius:5px;transition:.3s}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ch);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--sh2)}.toast.on{opacity:1;transform:translateX(-50%)}

.rail .lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:16px 12px 6px}.rail .spacer{flex:1}
.pane{background:var(--bg2);min-width:0}
.ctop{display:flex;align-items:center;gap:12px;padding:14px 32px;position:sticky;top:0;z-index:30;background:rgba(245,245,247,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.srch{flex:1;max-width:520px;position:relative;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:0 16px;box-shadow:var(--sh);color:var(--mut)}.srch input{border:0;padding:11px 0;background:transparent;box-shadow:none!important}

.ico{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--ch);position:relative}.ico .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--tf),var(--tq));color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.drop{position:absolute;top:64px;right:32px;background:#fff;border-radius:20px;box-shadow:var(--sh2);padding:10px;width:360px;z-index:60}.drop a{display:flex;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink);font-size:14px;align-items:flex-start}.drop a:hover{background:var(--bg2)}.drop .t{padding:8px 12px 6px;font-weight:600;font-size:13px;color:var(--mut)}
.drop.um{width:240px}
.pin{padding:8px 32px 48px;max-width:1240px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:12px 0 24px;flex-wrap:wrap}.ph h1{font-size:32px}.ph .mut{margin-top:4px}
.home{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}.home .col{display:flex;flex-direction:column;gap:24px;min-width:0}
.cont{display:grid;grid-template-columns:1.1fr 1fr;gap:0;overflow:hidden;padding:0}.cont .cov{aspect-ratio:auto;border-radius:0;min-height:260px}.cont .cb{padding:28px 32px;display:flex;flex-direction:column;gap:12px}.cont h2{font-size:26px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.st{padding:20px 22px;display:flex;flex-direction:column;gap:6px}.st .n{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:8px}.st .n svg{color:var(--tf)}
.mods{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.mod{background:var(--bg2);border-radius:16px;padding:14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;min-width:0}.mod:hover{background:var(--tint)}.mod.cur{background:var(--tint);outline:2px solid var(--tf)}.mod.done{background:var(--grnbg)}.mod b{font-size:13px;line-height:1.25;display:block;white-space:normal}
.hs{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px;scroll-snap-type:x mandatory}.hs>*{flex:0 0 250px;scroll-snap-align:start}
.ring{display:inline-grid;place-items:center;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;font-size:13px}

.lrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;cursor:pointer}.lrow:hover{background:var(--bg2)}.lrow .th{width:88px;aspect-ratio:16/10;border-radius:10px;flex:none}.lrow .t{flex:1;min-width:0}.lrow .t b{display:block;font-size:14.5px}.lrow .st{padding:0}
.tabbar{display:none}

.tree{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}

.tree a{display:flex;gap:10px;padding:9px 10px;border-radius:12px;font-size:13.5px;color:var(--ink);align-items:flex-start}.tree a:hover{background:var(--bg2)}.tree a.on{background:var(--tint);font-weight:600}

.lmain{background:var(--bg2);min-width:0}.lhead{display:flex;align-items:center;gap:14px;padding:14px 32px;background:rgba(245,245,247,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:20;font-size:14px}

.ltitle{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:22px 0 14px;flex-wrap:wrap}.ltitle h2{font-size:26px}

.tabs{margin:18px 0 14px}
.tabc{padding:24px}.tabc p{margin:0 0 12px;line-height:1.65}

.rate button{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:18px}.rate button:hover{background:var(--ambbg);border-color:#f2c36b}

/* общие мелочи */

return`${S.sub?"":`<div class="card dark" style="display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap"><div><h3>Подписка: все атомы + 4 урока на моделях в месяц</h3><span class="sm mut">Отмена в один клик · первые 7 дней бесплатно</span></div><a class="btn" onclick="go('#/p/sub')">Подробнее</a></div>`}<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px"><div class="seg">${["Всё","Атомы","Уроки на моделях","Курсы","Подписка"].map(x=>`<button class="${x==t?"on":""}" onclick="ui('ct','${x}')">${x}</button>`).join("")}</div></div>${t=="Атомы"?`<div class="chips" style="margin-bottom:20px">${TOPICS.map(x=>`<button class="chip ${x==tp?"on":""}" onclick="ui('tp','${x}')">${x}</button>`).join("")}</div>`:""}<div class="grid ${inCab?"c3":"c4"}">${Object.values(P).filter(f).filter(p=>t!="Атомы"||tp=="Все"||p.topic==tp).map(card).join("")}</div>`};
R.catalog=()=>`<div class="wrap"><section class="sec" style="padding-top:48px"><h1>Обучение</h1><p class="lead">Атомы — базовые уроки по одной теме. Уроки на моделях — комплексная работа. Подписка — всё вместе.</p>${catalogBody()}</section></div>`;
R.p=id=>{const p=P[id];if(!p)return R[""]();const n=lessons(p).length;return`<div class="wrap" style="padding-top:32px;padding-bottom:80px"><div class="bread"><a onclick="go('#/catalog')">Обучение</a>${ic("chev")}<span>${p.kind}</span></div><div class="two"><div><div class="video" style="background:${cov(p.topic)}"><div class="play">${ic("play",1)}</div><div class="vbar"><span>Трейлер: что внутри · 1:20</span></div></div><span class="kick" style="display:block;margin-top:24px">${p.kind}${p.topic&&p.kind=="Атом"?" · "+p.topic:""}</span><h1 style="margin:6px 0 12px">${p.title}</h1><p style="font-size:18px;color:var(--mut)">${p.desc}</p><h2 style="margin:36px 0 16px">Программа</h2><div style="display:grid;gap:12px">${p.mods.map((m,i)=>`<div class="card" style="padding:20px 26px"><h3 style="margin-bottom:6px">${p.mods.length>1?"Модуль "+(i+1)+" · ":""}${m.t}</h3>${m.ls.map(l=>`<div class="row"><span style="display:flex;gap:10px;align-items:center">${ic("play")}${l[1]}</span><span class="sm mut">${l[2]}</span></div>`).join("")}</div>`).join("")}</div><h2 style="margin:36px 0 12px">Материалы</h2><div class="chips">${p.files.map(f=>`<span class="chip">${f}</span>`).join("")}</div></div>
<aside class="card" style="position:sticky;top:80px"><div class="price" style="font-size:34px">${has(id)?"Открыто":p.price}</div><p class="sm mut" style="margin:6px 0 18px">${n} ${n==1?"урок":n<5?"урока":"уроков"} · ${p.kind=="Подписка"?"доступ пока активна подписка":"доступ бессрочно"}</p>${has(id)?`<a class="btn w" onclick="go('#/learn/${id}')">${ic("play")} Смотреть</a>`:`<a class="btn w" onclick="buy('${id}')">${p.kind=="Подписка"?"Оформить":"Купить"}</a>${p.sub&&p.kind!="Подписка"?`<p class="sm" style="margin-top:14px;text-align:center">или <a onclick="go('#/p/sub')">всё это в подписке →</a></p>`:""}${S.points?`<p class="sm mut" style="margin-top:12px;text-align:center">Можно оплатить баллами: у вас ${S.points}</p>`:""}`}<div style="margin-top:20px;display:grid;gap:8px;font-size:14px;color:var(--mut)">${["Смотрите с телефона и ноутбука","Конспект и таймкоды под каждым видео","Файлы: схемы и чек-листы"].map(x=>`<span style="display:flex;gap:8px;align-items:center">${ic("check")}${x}</span>`).join("")}</div></aside></div></div>`};
R.events=()=>`<div class="wrap"><section class="sec" style="padding-top:48px"><h1>Эфиры и вебинары</h1><p class="lead">Бесплатные — по регистрации. Записи уходят в подписку.</p><div style="display:grid;gap:12px;margin-bottom:56px">${EVENTS.map(evRow).join("")}</div><h2>Записи прошедших</h2><p class="lead">Доступны в подписке</p><div class="grid c4">${lessons(P.sub).filter(l=>l[1].startsWith("Эфир")).map(l=>`<div class="card hov pc" onclick="go('#/learn/sub/${l[0]}')"><div class="cov" style="background:${cov("Бизнес")}">${ic("play",1)}<span class="dur">${l[2]}</span></div><h3>${l[1].replace("Эфир: ","")}</h3><span class="pill">в подписке</span></div>`).join("")}</div></section></div>`;
R.salons=()=>`<div class="wrap"><div class="hero" style="padding-top:56px"><div><span class="kick">Для салонов и студий</span><h1>Обучайте мастеров и видьте, кто что прошёл</h1><p class="lead">Одна подписка на команду. У каждого мастера свой кабинет, у руководителя — прогресс всех и сданные отработки.</p><div class="cta"><a class="btn" onclick="go('#/salonform')">Оставить заявку</a><a class="btn o" onclick="demo('salon')">Посмотреть демо-кабинет</a></div></div><div class="mock"><div class="card" style="padding:20px"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>Салон «Ноготок»</b><span class="pill t">7 из 10 мест</span></div>${[["Даша П.",82],["Лена С.",64],["Настя К.",31],["Вика Т.",100]].map(m=>`<div style="display:grid;grid-template-columns:80px 1fr 40px;gap:10px;align-items:center;font-size:13px;padding:6px 0">${m[0]}${bar(m[1],100)}<b>${m[1]}%</b></div>`).join("")}</div></div></div></div>
<section class="sec g"><div class="wrap"><h2 style="margin-bottom:28px">Как это работает</h2><div class="grid c4">${[["1","Покупаете места","Подписка на 5, 10 или 20 мастеров"],["2","Добавляете мастеров","По почте, заменить можно в любой момент"],["3","Назначаете уроки","Что пройти к какому сроку"],["4","Смотрите прогресс","Кто сколько прошёл, сдал ли отработку"]].map(x=>`<div class="card"><span class="kick">Шаг ${x[0]}</span><h3 style="margin:8px 0">${x[1]}</h3><p class="sm mut">${x[2]}</p></div>`).join("")}</div></div></section>
<section class="sec"><div class="wrap"><h2 style="margin-bottom:28px">Тарифы</h2><div class="grid c3">${[[5,""],[10,"популярный"],[20,""]].map(n=>`<div class="card ${n[1]?"dark":""}" style="text-align:center;padding:36px">${n[1]?`<span class="pill t" style="margin-bottom:12px">${n[1]}</span>`:""}<h3>${n[0]} мастеров</h3><div class="price" style="font-size:34px;margin:10px 0">X ₽<span class="mut" style="font-size:15px;font-weight:400">/мес</span></div><p class="sm mut" style="margin-bottom:20px">кабинет руководителя, замена мастеров, отчёты</p><a class="btn ${n[1]?"":"o"} w" onclick="go('#/salonform')">Выбрать</a></div>`).join("")}</div></div></section>`;
R.salonform=()=>`<div class="wrap"><div class="form card"><h1>Заявка салона</h1><p class="mut sm">Перезвоним в рабочее время, покажем кабинет руководителя.</p><label class="l">Название салона</label><input placeholder="Ноготок"><label class="l">Город</label><input placeholder="Москва"><label class="l">Сколько мастеров</label><input placeholder="7"><label class="l">Телефон или Телеграм</label><input placeholder="+7 …"><label class="chk"><input type="checkbox" checked> Даю согласие на обработку персональных данных</label><a class="btn w" onclick="toast('Заявка отправлена');go('#/')">Отправить</a></div></div>`;

R.register=()=>`<div class="wrap"><div class="form card"><span class="kick">Бесплатно</span><h1>Регистрация</h1><p class="mut sm" style="margin-bottom:8px">Откроются закрытые материалы, а один атом — в подарок.</p><label class="l">Имя</label><input id="rn" value="Аня"><label class="l">Почта</label><input id="re" value="anya@mail.ru"><label class="chk"><input type="checkbox" id="rc"> Даю согласие на обработку персональных данных и принимаю <a>политику конфиденциальности</a></label><label class="chk"><input type="checkbox"> Хочу получать письма о новых уроках (необязательно)</label><button class="btn w" onclick="reg()">Получить код на почту</button><p class="sm mut" style="text-align:center;margin-top:16px">Уже есть аккаунт? <a onclick="go('#/login')">Войти</a></p></div></div>`;
function reg(){if(!document.getElementById("rc").checked)return toast("Без согласия на обработку данных регистрация невозможна");const n=document.getElementById("rn").value,e=document.getElementById("re").value;const after=S.ui.after;S=JSON.parse(JSON.stringify(def));S.ui.after=after;S.role="user";S.name=n;S.email=e;S.points=50;S.hist=[["+50","Регистрация","23.09"]];save();go("#/code")}
R.code=()=>`<div class="wrap"><div class="form card" style="text-align:center"><h1>Введите код</h1><p class="sm mut">Отправили 4 цифры на ${S.email||"почту"}</p><input value="1234" style="letter-spacing:.5em;font-size:28px;text-align:center;margin:20px 0;font-weight:600"><button class="btn w" onclick="go(S.gift?(S.ui.after||'#/lk'):'#/gift')">Войти</button><p class="sm mut" style="margin-top:14px"><a>Отправить ещё раз</a></p></div></div>`;
R.login=()=>`<div class="wrap"><div class="form card"><h1>Вход</h1><p class="sm mut">Участники клуба с GetCourse — входите по той же почте, доступы перенесены.</p><label class="l">Почта</label><input value="marina@mail.ru"><button class="btn w" style="margin-top:16px" onclick="if(!S.email){demo('club');return}go('#/code')">Получить код</button><p class="sm mut" style="text-align:center;margin-top:16px">Нет аккаунта? <a onclick="go('#/register')">Регистрация</a></p></div></div>`;
R.gift=()=>`<div class="wrap"><section class="sec" style="padding-top:48px"><div style="text-align:center;max-width:620px;margin:0 auto 36px"><span class="ico" style="margin:0 auto 14px;width:56px;height:56px;background:var(--tint);color:var(--tfd)">${ic("gift")}</span><h1>Выберите урок в подарок</h1><p class="lead" style="margin:8px 0 0">Любой атом — бесплатно и навсегда. Берите тот, где сейчас больше всего вопросов.</p></div><div class="grid c4">${ATOMS.map(a=>`<div class="card hov pc" onclick="pickGift('${a[0]}')"><div class="cov" style="background:${cov(a[2])}">${ic("play",1)}<span class="dur">${a[3]} мин</span></div><span class="kick">${a[2]}</span><h3>${a[1]}</h3><div class="foot"><span class="pill">${a[4]} ₽</span><span class="price" style="color:var(--tfd)">Выбрать</span></div></div>`).join("")}</div></section></div>`;
function pickGift(id){S.gift=id;if(!S.owned.includes(id))S.owned.push(id);const a=S.ui.after;S.ui.after=null;save();toast("Подарок ваш!");go(a||"#/learn/"+id)}
R.checkout=id=>{const p=P[id]||P.sub;return`<div class="wrap"><div class="form card" style="max-width:500px"><h1>Оплата</h1><div class="row" style="margin-top:10px"><span><span class="kick">${p.kind}</span><br>${p.title}</span><b style="font-size:20px">${p.price}</b></div>${S.points?`<label class="chk"><input type="checkbox"> Списать баллы: ${S.points} ₽</label>`:""}<label class="l">Промокод</label><input placeholder="BEAUTYDAY"><label class="l">Карта</label><input value="4242 4242 4242 4242"><label class="chk"><input type="checkbox" checked> Сохранить карту для оплаты в 1 клик</label>${p.kind=="Подписка"?'<label class="chk"><input type="checkbox" checked> Согласен на автопродление. Отменить можно в кабинете одной кнопкой</label>':""}<button class="btn w" onclick="pay('${p.id}')">Оплатить ${p.price}</button><p class="xs mut" style="text-align:center;margin-top:12px">ЮKassa · чек придёт на почту</p></div></div>`};

const need=()=>`<div class="wrap"><div class="form card" style="text-align:center"><h3>Нужно войти</h3><p class="sm mut" style="margin:8px 0 16px">Кабинет доступен после входа</p><a class="btn" onclick="go('#/login')">Войти</a></div></div>`;

return cab("lk",`<div class="ph"><div><h1>${greet()}, ${S.name.replace(/^Салон /,"")}</h1><p class="mut">${today()} · ${S.streak>1?`серия ${S.streak} ${S.streak<5?"дня":"дней"} подряд`:"первый день на платформе"}</p></div>${S.sub?"":`<a class="btn s" onclick="go('#/p/sub')">${ic("bolt")} Оформить подписку</a>`}</div>
<div class="home"><div class="col">
${nx?`<div class="card cont"><div class="cov" style="background:${cov(cm.top||cur.topic)}" onclick="go('#/learn/${cur.id}/${nx[1][0]}')"><div class="play">${ic("play",1)}</div><span class="dur">${nx[1][2]}</span></div><div class="cb"><span class="kick">${S.half[nx[1][0]]?"Продолжить":"Следующий урок"} · ${cur.mods.length>1?"модуль "+(mi+1)+" · ":""}${cm.t}</span><h2>${nx[1][1]}</h2><p class="mut sm">${cur.title} · ${b-a} ${b-a==1?"урок":b-a<5?"урока":"уроков"} до конца</p>${bar(a,b)}<div class="cta" style="margin-top:6px"><a class="btn" onclick="go('#/learn/${cur.id}/${nx[1][0]}')">${ic("play")} Смотреть</a><a class="btn gh s" onclick="go('#/p/${cur.id}')">Программа</a></div></div></div>${upcoming.length?`<div class="card" style="padding:10px"><div class="lab xs mut" style="padding:8px 14px 4px;font-weight:600;text-transform:uppercase;letter-spacing:.08em">Дальше по плану</div>${upcoming.map(l=>lrow(cur,l)).join("")}</div>`:""}`:`<div class="card cont"><div class="cov" style="background:${cov("Кутикула")}"><span class="ico" style="width:56px;height:56px;box-shadow:none">${ic("gift")}</span></div><div class="cb"><span class="kick">Подарок</span><h2>Выберите первый урок</h2><p class="mut sm">Любой атом бесплатно и навсегда</p><div class="cta"><a class="btn" onclick="go('#/gift')">Выбрать атом</a></div></div></div>`}
<div class="stat3"><div class="card st"><span class="sm mut">Серия</span><span class="n">${ic("flame")}${S.streak} ${S.streak==1?"день":S.streak<5?"дня":"дней"}</span><span class="xs mut">${S.streak>1?"не прерывайте — урок в день":"посмотрите урок сегодня"}</span></div><div class="card st"><span class="sm mut">Цель недели</span><span class="n">${ic("target")}${S.week} из ${S.goal}</span>${bar(S.week,S.goal)}<span class="xs mut"><a onclick="S.goal=S.goal==3?5:3;save();render()">цель: ${S.goal} урока · изменить</a></span></div><div class="card st"><span class="sm mut">Ближайший эфир</span><span class="n" style="font-size:22px">${ic("live")}${EVENTS[0][2]}, ${EVENTS[0][3]}</span><span class="xs mut">${EVENTS[0][1]} · <a onclick="toast('Напомним за час на почту и в Телеграм')">напомнить</a></span></div></div>

R.learn=(pid,lid)=>{const p=P[pid];if(!p)return R.lk();if(!S.role)return need();if(!has(pid))return R.p(pid);const L=lessons(p);const l=L.find(x=>x[0]==lid)||L.find(x=>!S.prog[x[0]])||L[0];if(!S.prog[l[0]])S.half[l[0]]=1;save();const i=L.indexOf(l);const[a,b]=pct(p);const tab=S.ui.tab||"sum";const star=S.stars.includes(l[0]);const m=modOf(p,l[0]);
return`<div class="learn"><aside class="tree ${S.ui.tree?"":"cl"}"><a class="lnk" onclick="go('#/lk/courses')" style="padding:4px 8px">${ic("back")} Моё обучение</a><div style="padding:12px 8px 4px"><h3 style="font-size:17px">${p.title}</h3><div style="display:flex;align-items:center;gap:12px;margin-top:10px"><div style="flex:1">${bar(a,b)}</div><span class="xs mut">${a}/${b}</span></div><button class="btn o xs" style="margin-top:12px;display:none" id="treebtn" onclick="S.ui.tree=!S.ui.tree;save();render()">${S.ui.tree?"Скрыть программу":"Программа курса"}</button></div><div class="lst">${p.mods.map((mm,mi)=>`<div class="mh"><span>${p.mods.length>1?"Модуль "+(mi+1)+" · ":""}${mm.t}</span><span>${mm.ls.filter(x=>S.prog[x[0]]).length}/${mm.ls.length}</span></div>${mm.ls.map(x=>`<a class="${x[0]==l[0]?"on":""}" onclick="go('#/learn/${pid}/${x[0]}')"><span class="dotst ${S.prog[x[0]]?"done":S.half[x[0]]?"half":""}">${S.prog[x[0]]?ic("check"):""}</span><span>${x[1]}<br><span class="xs mut">${x[2]}${S.stars.includes(x[0])?" · ★":""}</span></span></a>`).join("")}`).join("")}</div></aside>
<div class="lmain"><div class="lhead"><span class="mut">${p.kind}</span>${ic("chev")}<span class="mut">${m.t}</span><span style="flex:1"></span><span class="pill t">${Math.round(a/b*100)}%</span><button class="ava" style="width:34px;height:34px;font-size:12px" onclick="go('#/lk')">${initials()}</button></div><div class="lbody">
<div class="video" style="background:${cov(m.top||p.topic)}"><div class="play">${ic("play",1)}</div>${[[10,15],[45,55],[70,20],[25,75]].map(q=>`<span class="wm" style="left:${q[0]}%;top:${q[1]}%">${S.email}</span>`).join("")}<div class="vbar"><span>3:24</span><div class="tl"><i></i></div><span>${l[2]}</span></div></div>
<div class="ltitle"><div><span class="kick">Урок ${i+1} из ${L.length}</span><h2>${l[1]}</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="star ${star?"on":""}" onclick="tStar('${l[0]}')">${ic("star",star)} ${star?"В избранном":"В избранное"}</button><button class="btn ${S.prog[l[0]]?"o":"dk"} s" onclick="done('${pid}','${l[0]}')">${S.prog[l[0]]?ic("check")+" Пройден":"Отметить пройденным"}</button></div></div>
<div class="seg tabs">${[["sum","Конспект"],["tc","Таймкоды"],["files","Файлы"],["note","Моя заметка"],["rate","Оценить и сдать работу"]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="ui('tab','${t[0]}')">${t[1]}</button>`).join("")}</div>
<div class="card tabc">${{sum:`<p><b>1. Подготовка.</b> Размягчаем кутикулу, проверяем состояние валиков. Ремувер держим 30–40 секунд.</p><p><b>2. Отодвигаем</b> под углом 30–45°, без давления. Если не понятно, как не сделать больно — <a onclick="go('#/p/a1')">атом «Как не сделать больно, отодвигая кутикулу»</a>.</p><p><b>3. Срез.</b> Фреза-пламя, 15–20 тыс. об/мин, движение от себя. Подробно — <a onclick="go('#/p/a2')">атом про выбор фрезы</a>.</p><p><b>4. Проверка.</b> Проводим пальцем по валику: не должно цеплять. Если цепляет — шлифовка, не срез.</p>`,
tc:["00:00 Вступление","01:40 Подготовка рабочего места","04:15 Отодвигаем кутикулу","09:30 Срез фрезой","14:05 Типичные ошибки"].map(t=>`<div class="tc"><a onclick="toast('Перемотка на ${t.split(" ")[0]}')">${t.split(" ")[0]}</a><span>${t.slice(6)}</span></div>`).join(""),
files:p.files.map(f=>`<div class="row"><span style="display:flex;gap:8px;align-items:center">${ic("file")}${f}</span><a class="btn o xs" onclick="toast('Скачано')">${ic("dl")} Скачать</a></div>`).join(""),
note:`<textarea id="nt" rows="4" placeholder="Заметка к этому уроку — появится в «Материалах»"></textarea><button class="btn s" style="margin-top:12px" onclick="addNote('${l[0]}')">Сохранить заметку</button>${S.notes.filter(n=>n.l==l[0]).map(n=>`<div style="background:var(--bg2);border-radius:14px;padding:14px 16px;margin-top:12px">${n.t}<div class="xs mut" style="margin-top:4px">${n.d}</div></div>`).join("")}`,
rate:`<p style="margin-bottom:8px"><b>Оцените урок</b> <span class="mut sm">+10 баллов</span></p><div class="rate" style="display:flex;gap:8px;margin-bottom:22px">${[1,2,3,4,5].map(n=>`<button onclick="S.points+=10;S.hist.unshift(['+10','Оценка урока','23.09']);save();toast('Спасибо! +10 баллов')">${n}</button>`).join("")}</div><p style="margin-bottom:4px"><b>Сдать работу</b> <span class="mut sm">+30 баллов</span></p><p class="sm mut">Фото работы после урока идёт в кейсы платформы, без проверки куратором. Цифровой куратор откроет следующий модуль.</p><div class="drag hov" onclick="S.points+=30;S.hist.unshift(['+30','Работа после урока','23.09']);if(!S.hw.includes('m2'))S.hw.push('m2');save();toast('Работа загружена, +30 баллов')">${ic("plus")} перетащите фото или нажмите</div>`}[tab]}</div>
<div class="lnav">${i>0?`<a class="btn o s" onclick="go('#/learn/${pid}/${L[i-1][0]}')">${ic("back")} ${L[i-1][1]}</a>`:"<span></span>"}${i<L.length-1?`<a class="btn s" onclick="done('${pid}','${l[0]}',1)">Следующий: ${L[i+1][1]} ${ic("arrow")}</a>`:`<a class="btn s" onclick="done('${pid}','${l[0]}');go('#/lk')">Завершить ${ic("check")}</a>`}</div>
<p class="xs mut" style="margin-top:20px">Видео защищено водяным знаком с вашей почтой. Материалы для сохранения — во вкладке «Файлы».</p></div></div></div>`};
function done(pid,lid,next){if(!S.prog[lid]){S.prog[lid]=1;S.week=Math.min(S.goal,S.week+1)}delete S.half[lid];save();if(next){const L=lessons(P[pid]);go('#/learn/'+pid+'/'+L[L.findIndex(x=>x[0]==lid)+1][0])}else render()}
function tStar(id){S.stars=S.stars.includes(id)?S.stars.filter(x=>x!=id):[...S.stars,id];save();render()}
function addNote(l){const t=document.getElementById("nt").value.trim();if(!t)return;S.notes.unshift({l,t,d:new Date().toLocaleDateString("ru",{day:"2-digit",month:"2-digit"})});save();toast("Заметка сохранена");render()}
