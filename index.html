<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--tf:#0ABAB5;--tf2:#09A8A3;--tfd:#0A8481;--tq:#5EEAD4;--tint:#E6F8F7;--tint2:#CDF1EF;--ink:#171717;--ch:#1e2022;--mut:#6e6e73;--mut2:#86868b;--bg:#fff;--bg2:#f5f5f7;--line:#e8e8ed;--red:#d92d20;--redbg:#fde8e6;--amb:#a15c00;--ambbg:#fff3df;--grn:#0f7a5a;--grnbg:#e2f5ec;--sh:0 4px 20px rgba(0,0,0,.04);--sh2:0 14px 40px rgba(0,0,0,.09);--r:24px;--rm:13px;--rs:6px;--tfh:#0A9A96;--r2:32px;--sh3:0 18px 44px rgba(16,24,24,.14);--eo:cubic-bezier(.2,.8,.2,1);--ph-t:linear-gradient(155deg,#E3F7F5,#A9E4DF);--ph-n:linear-gradient(155deg,#F5E6DF,#DDB3A5);--ph-k:linear-gradient(155deg,#0a5f5c,#0ABAB5 65%,#5EEAD4);--glass:rgba(255,255,255,.10);--glass-b:rgba(255,255,255,.16);--on-dark:#c7c7cc}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}

p{margin:0}.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12px}.b{font-weight:600}
.kick{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tfd)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--tf);color:#062a29;border:1px solid transparent;border-radius:var(--rm);padding:13px 24px;font-size:15px;font-weight:600;min-height:50px;transition:.15s;white-space:nowrap;cursor:pointer;line-height:1.2}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c2{grid-template-columns:repeat(2,1fr)}

.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}.seg button{border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;color:var(--mut);transition:.15s}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500}.chip.on{background:var(--ch);color:#fff;border-color:var(--ch)}

.hr{display:flex;gap:14px;align-items:center;margin-left:auto}
/* главная сайта */

.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.trust{display:flex;gap:22px;margin-top:28px;color:var(--mut);font-size:14px;flex-wrap:wrap}.trust b{color:var(--ink);font-size:20px;display:block;letter-spacing:-.02em}
.mock{background:var(--bg2);border-radius:32px;padding:28px;position:relative}
.mock .pl{background:#fff;border-radius:20px;box-shadow:var(--sh2);overflow:hidden}.mock .v{aspect-ratio:16/9;background:linear-gradient(135deg,#0c3f3d,#0ABAB5 70%,#5EEAD4);position:relative;display:grid;place-items:center}
.play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.mock .pb{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.float{position:absolute;background:#fff;border-radius:16px;box-shadow:var(--sh2);padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px}.float.a{left:-28px;bottom:-30px}.float.b{right:-18px;top:36px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-8px}
.lvl3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.lvl3 .lvlcard{padding:20px 22px}
.tile{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--tfd);display:grid;place-items:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}.steps:before{content:"";position:absolute;left:8%;right:8%;top:28px;border-top:2px dashed var(--line)}

.subban{border-radius:32px;padding:56px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}.subban h2{font-size:40px;letter-spacing:-.03em;line-height:1.1}.subban ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}.subban li{display:flex;gap:10px;align-items:center}.subban li svg{color:var(--tq)}
.artc{display:flex;flex-direction:column;gap:12px}.artc .cov{aspect-ratio:16/9}
.evrow{display:flex;align-items:center;gap:24px;padding:22px 26px}.evrow .d{width:64px;text-align:center;flex:none}.evrow .d b{font-size:26px;display:block;line-height:1;letter-spacing:-.02em}.evrow .d span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}

.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.row:last-child{border-bottom:0}

.drop{position:absolute;top:64px;right:32px;background:#fff;border-radius:20px;box-shadow:var(--sh2);padding:10px;width:360px;z-index:60}.drop a{display:flex;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink);font-size:14px;align-items:flex-start}.drop a:hover{background:var(--bg2)}.drop .t{padding:8px 12px 6px;font-weight:600;font-size:13px;color:var(--mut)}
.drop.um{width:240px}
.pin{padding:8px 32px 48px;max-width:1240px}

<div class="stat3"><div class="card st"><span class="sm mut">Серия</span><span class="n">${ic("flame")}${S.streak} ${S.streak==1?"день":S.streak<5?"дня":"дней"}</span><span class="xs mut">${S.streak>1?"не прерывайте — урок в день":"посмотрите урок сегодня"}</span></div><div class="card st"><span class="sm mut">Цель недели</span><span class="n">${ic("target")}${S.week} из ${S.goal}</span>${bar(S.week,S.goal)}<span class="xs mut"><a onclick="S.goal=S.goal==3?5:3;save();render()">цель: ${S.goal} урока · изменить</a></span></div><div class="card st"><span class="sm mut">Ближайший эфир</span><span class="n" style="font-size:22px">${ic("live")}${EVENTS[0][2]}, ${EVENTS[0][3]}</span><span class="xs mut">${EVENTS[0][1]} · <a onclick="toast('Напомним за час на почту и в Телеграм')">напомнить</a></span></div></div>
${cur&&cur.mods.length>1?`<div class="card"><div class="shead" style="margin-bottom:16px"><div><h3>${cur.title}</h3><span class="sm mut">${a} из ${b} уроков · ${Math.round(a/b*100)}%</span></div><a class="lnk" onclick="go('#/learn/${cur.id}')">открыть курс ${ic("chev")}</a></div><div class="mods">${cur.mods.map((m,i)=>{const d=m.ls.filter(l=>S.prog[l[0]]).length;const first=m.ls.find(l=>!S.prog[l[0]])||m.ls[0];return`<div class="mod ${d==m.ls.length?"done":i==mi?"cur":""}" onclick="go('#/learn/${cur.id}/${first[0]}')"><span class="xs mut">Модуль ${i+1}</span><b>${m.t}</b>${bar(d,m.ls.length)}<span class="xs mut">${d}/${m.ls.length}</span></div>`}).join("")}</div></div>`:""}
${S.sub?`<div><div class="shead" style="margin-bottom:14px"><div><h3>Новое в подписке · сентябрь</h3><span class="sm mut">4 урока на моделях и эфир</span></div><a class="lnk" onclick="go('#/learn/sub')">все уроки ${ic("chev")}</a></div><div class="hs">${P.sub.mods[0].ls.map(l=>`<div class="card hov pc" onclick="go('#/learn/sub/${l[0]}')"><div class="cov" style="background:${cov(l[1].startsWith("Эфир")?"Бизнес":"Покрытие")}">${ic("play",1)}<span class="dur">${l[2]}</span></div><h3 style="font-size:15px">${l[1]}</h3>${S.prog[l[0]]?'<span class="pill g">просмотрен</span>':'<span class="pill t">новое</span>'}</div>`).join("")}</div></div>`:mine.length?`<div class="card dark" style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap"><div><span class="kick" style="color:var(--tq)">Подписка</span><h3 style="margin-top:6px">Все атомы + 4 урока на моделях в месяц</h3><span class="sm mut">Первые 7 дней бесплатно, отмена в один клик</span></div><a class="btn" onclick="go('#/p/sub')">Попробовать</a></div>`:""}
<div><div class="shead" style="margin-bottom:14px"><div><h3>Цифровой куратор советует</h3><span class="sm mut">${cm?`Атомы по теме текущего модуля «${cm.t}»`:"С чего начать"}</span></div><a class="lnk" onclick="go('#/lk/shop')">каталог ${ic("chev")}</a></div><div class="grid c3">${(rec.length?rec:atomsBy("Фрезы").slice(0,3)).map(card).join("")}</div></div>
</div><aside class="col side">
<div class="card">${S.sub?`<h4>Подписка <span class="pill g">активна</span></h4><p class="sm">Продлится ${S.sub} · X ₽/мес</p>${bar(30,30)}<p class="xs mut" style="margin:6px 0 12px">30 дней до списания · автопродление ${S.auto?"включено":"выключено"}</p><a class="lnk sm" onclick="go('#/lk/sub')">Управлять ${ic("chev")}</a>`:`<h4>Подписка <span class="pill">нет</span></h4><p class="sm mut" style="margin-bottom:12px">Все атомы, 4 урока на моделях в месяц, записи эфиров.</p><a class="btn w s" onclick="go('#/p/sub')">Попробовать 7 дней</a>`}</div>
<div class="card"><h4>Бонусы <span class="pill t">${S.points} баллов</span></h4><p class="sm mut" style="margin-bottom:10px">1 балл = 1 ₽ при оплате атомов и подписки</p><div class="reflink"><span>logika.ru/?r=${(S.email||"x").split("@")[0]}</span><button class="btn o xs" onclick="toast('Ссылка скопирована')">${ic("copy")}</button></div><p class="xs mut" style="margin:8px 0 10px">Подруга купила по ссылке — вам 20% баллами</p><a class="lnk sm" onclick="go('#/lk/bonus')">Как заработать ещё ${ic("chev")}</a></div>
${hwDue?`<div class="card" style="border:1px solid var(--tf)"><h4>Отработка <span class="pill y">ждёт</span></h4><p class="sm" style="margin-bottom:12px">Модуль «Кутикула» пройден. Загрузите фото работы — +30 баллов и материал для кейса.</p><a class="btn dk w s" onclick="S.ui.tab='rate';save();go('#/learn/kombi/kombi-1-3')">Сдать работу</a></div>`:""}
${!S.ui.prof?`<div class="card"><h4>Анкета <span class="pill t">+100</span></h4><p class="sm mut" style="margin-bottom:12px">Расскажите про опыт — подберём уроки и начислим баллы.</p><a class="btn o w s" onclick="go('#/lk/profile')">Заполнить</a></div>`:""}
<div class="card"><h4>Заметки <span class="pill">${S.notes.length}</span></h4>${S.notes.slice(0,2).map(n=>{const[p,l]=lname(n.l);return`<div class="row" style="padding:8px 0;font-size:13.5px;display:block"><a style="color:var(--ink)" onclick="go('#/learn/${p.id}/${n.l}')">${n.t}</a><div class="xs mut">${l[1]} · ${n.d}</div></div>`}).join("")||'<p class="sm mut">Пишутся прямо под уроком</p>'}<a class="lnk sm" onclick="go('#/lk/mat')">Все материалы ${ic("chev")}</a></div>
</aside></div>`)};
R["lk/courses"]=()=>{if(!S.role)return need();const mine=myProds();const inProg=mine.filter(p=>{const[a,b]=pct(p);return a>0&&a<b});const fresh=mine.filter(p=>pct(p)[0]==0);const done=mine.filter(p=>{const[a,b]=pct(p);return a==b&&b>0});
const pc2=p=>{const[a,b]=pct(p);const nx=lessons(p).find(x=>!S.prog[x[0]]);return`<div class="card hov pc" onclick="go('#/learn/${p.id}${nx?"/"+nx[0]:""}')"><div class="cov" style="background:${cov(p.topic)}">${ic("play",1)}<span class="dur">${b} ${b==1?"урок":"уроков"}</span></div><span class="kick">${p.kind}</span><h3>${p.title}</h3>${bar(a,b)}<div class="foot"><span class="sm mut">${a} из ${b}</span>${a==b?'<span class="pill g">пройден</span>':`<span class="price" style="color:var(--tfd)">${a?"Продолжить":"Начать"} →</span>`}</div></div>`};

ation()"><h3>Отменить подписку?</h3><p class="sm mut" style="margin:8px 0 20px">Доступ ко всем урокам сохранится до ${S.sub}. Списаний больше не будет. Вернуться можно в любой момент.</p><div class="cta"><a class="btn dk" onclick="S.sub=null;S.ui.cancel=0;save();toast('Подписка отменена');render()">Да, отменить</a><a class="btn o" onclick="ui('cancel',0)">Оставить</a></div></div></div>`:""}`)};

R.learn=(pid,lid)=>{const p=P[pid];if(!p)return R.lk();if(!S.role&&p.price!="Бесплатно")return need();if(!has(pid))return R.p(pid);const L=lessons(p);const l=L.find(x=>x[0]==lid)||L.find(x=>!S.prog[x[0]])||L[0];if(!S.prog[l[0]])S.half[l[0]]=1;save();const i=L.indexOf(l);const[a,b]=pct(p);const tab=S.ui.tab||"sum";const star=S.stars.includes(l[0]);const m=modOf(p,l[0]);

<div class="lmain"><div class="lhead"><span class="mut">${p.kind}</span>${ic("chev")}<span class="mut">${m.t}</span><span style="flex:1"></span><span class="pill t">${Math.round(a/b*100)}%</span><button class="ava" style="width:34px;height:34px;font-size:12px" onclick="go('#/lk')">${initials()}</button></div><div class="lbody">

<div class="ltitle"><div><span class="kick">Урок ${i+1} из ${L.length}</span><h2>${l[1]}</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="star ${star?"on":""}" onclick="tStar('${l[0]}')">${ic("star",star)} ${star?"В избранном":"В избранное"}</button><button class="btn ${S.prog[l[0]]?"o":"dk"} s" onclick="done('${pid}','${l[0]}')">${S.prog[l[0]]?ic("check")+" Пройден":"Отметить пройденным"}</button></div></div>
<div class="seg tabs">${[["sum","Конспект"],["tc","Таймкоды"],["files","Файлы"],["note","Моя заметка"],["rate","Оценить и сдать работу"]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="ui('tab','${t[0]}')">${t[1]}</button>`).join("")}</div>
<div class="card tabc">${{sum:`<p><b>1. Подготовка.</b> Размягчаем кутикулу, проверяем состояние валиков. Ремувер держим 30–40 секунд.</p><p><b>2. Отодвигаем</b> под углом 30–45°, без давления. Если не понятно, как не сделать больно — <a onclick="go('#/p/a1')">атом «Как не сделать больно, отодвигая кутикулу»</a>.</p><p><b>3. Срез.</b> Фреза-пламя, 15–20 тыс. об/мин, движение от себя. Подробно — <a onclick="go('#/p/a2')">атом про выбор фрезы</a>.</p><p><b>4. Проверка.</b> Проводим пальцем по валику: не должно цеплять. Если цепляет — шлифовка, не срез.</p>`,

note:`<textarea id="nt" rows="4" placeholder="Заметка к этому уроку — появится в «Материалах»"></textarea><button class="btn s" style="margin-top:12px" onclick="addNote('${l[0]}')">Сохранить заметку</button>${S.notes.filter(n=>n.l==l[0]).map(n=>`<div style="background:var(--bg2);border-radius:14px;padding:14px 16px;margin-top:12px">${n.t}<div class="xs mut" style="margin-top:4px">${n.d}</div></div>`).join("")}`,

<div class="lnav">${i>0?`<a class="btn o s" onclick="go('#/learn/${pid}/${L[i-1][0]}')">${ic("back")} ${L[i-1][1]}</a>`:"<span></span>"}${i<L.length-1?`<a class="btn s" onclick="done('${pid}','${l[0]}',1)">Следующий: ${L[i+1][1]} ${ic("arrow")}</a>`:`<a class="btn s" onclick="done('${pid}','${l[0]}');go('#/lk')">Завершить ${ic("check")}</a>`}</div>
<p class="xs mut" style="margin-top:20px">Видео защищено водяным знаком с вашей почтой. Материалы для сохранения — во вкладке «Файлы».</p></div></div></div>`};
function done(pid,lid,next){if(!S.prog[lid]){S.prog[lid]=1;S.week=Math.min(S.goal,S.week+1)}delete S.half[lid];save();if(next){const L=lessons(P[pid]);go('#/learn/'+pid+'/'+L[L.findIndex(x=>x[0]==lid)+1][0])}else render()}
function tStar(id){S.stars=S.stars.includes(id)?S.stars.filter(x=>x!=id):[...S.stars,id];save();render()}
function addNote(l){const t=document.getElementById("nt").value.trim();if(!t)return;S.notes.unshift({l,t,d:new Date().toLocaleDateString("ru",{day:"2-digit",month:"2-digit"})});save();toast("Заметка сохранена");render()}

<section class="sec"><div class="wrap"><span class="kick">Что внутри подписки</span><h2 class="hb">Готовые треки — <em>назначаете в два клика</em></h2><p class="lead">Не нужно собирать программу самим: треки уже разложены под уровень мастера. Всё остальное из подписки тоже доступно команде.</p><div class="sltr">${SLTRACK.map((t,j)=>`<div class="card"><span class="pill ${j==0?"t":""}">${t[0]}</span><h3>${t[1]}</h3>${t[2].map(id=>`<a class="sltl" onclick="go('#/p/${id}')"><span class="slic sm">${ic("play")}</span><span>${P[id].title}</span><span class="xs mut">${slLen(id)}</span></a>`).join("")}<a class="lnk sm" onclick="toast('Трек назначен в демо-кабинете');demo('salon')">Назначить трек ${ic("chev")}</a></div>`).join("")}</div></div></section>
<section class="sec g"><div class="wrap slcalc"><div><span class="kick">Посчитайте</span><h2 class="hb">Сколько салон теряет <em>на переделках</em></h2><p class="lead">Подставьте свои цифры. Считаем только прямые потери — без клиентов, которые после переделки не вернулись.</p><div class="slin"><label class="l">Мастеров в салоне<input id="slc1" type="number" min="1" value="${sv}" oninput="slCalc();S.ui.slseats=+this.value||S.ui.slseats"></label><label class="l">Переделок у мастера в месяц<input id="slc2" type="number" min="0" value="2" oninput="slCalc()"></label><label class="l">Средний чек, ₽<input id="slc3" type="number" min="0" step="100" value="2500" oninput="slCalc()"></label></div></div><div class="card dark slres"><span class="sm">Теряете в месяц</span><b id="slcl" class="slbig">—</b><span class="sm">в год — <b id="slcy">—</b></span><hr><p class="sm">Если обучение уберёт хотя бы половину переделок, салон сохранит <b id="slch">—</b> в месяц.</p><a class="btn w" onclick="slGo(+document.getElementById('slc1').value)">Проверить на своей команде</a></div></div></section>
<section class="sec"><div class="wrap"><span class="kick">Как подключиться</span><h2 class="hb">Запустим обучение <em>без вашего участия</em></h2><div class="slst">${[["Оставляете заявку","Или сразу берёте пробный доступ — карта не нужна."],["Подключаем салон","Менеджер заводит кабинет, отправляет приглашения мастерам и назначает стартовый трек."],["Пробная неделя","Мастера учатся, вы видите прогресс и первые отработки."],["Решаете","Продлеваете по счёту — или просто не продлеваете. Никаких списаний."]].map((s,i)=>`<div><span class="slno">${i+1}</span><h3>${s[0]}</h3><p class="sm mut">${s[1]}</p></div>`).join("")}</div><div class="slsup">${[["user","Личный менеджер салона","от подключения до ежемесячных отчётов"],["chat","Поддержка в Телеграме","отвечаем в рабочее время"],["book","Инструкция для руководителя","как назначать, проверять и читать отчёты"]].map(x=>`<div><span class="slic">${ic(x[0])}</span><span><b>${x[1]}</b><span class="xs mut">${x[2]}</span></span></div>`).join("")}</div></div></section>
<section class="sec g"><div class="wrap slkat">${hph("Фото: Катя с командой салона","slkph","n")}<div><span class="kick">Автор программы</span><h2 class="hb">Катя Туркеева, <em>nail-педагог</em></h2><p class="lead">Программа для салонов собрана из того же обучения, которое проходят мастера в клубе, — плюс инструменты, чтобы руководитель видел результат.</p><div class="slkl">${["Снимает каждый урок сама: крупно, медленно, с разбором типичных ошибок","Учит одному стандарту — мастера в салоне работают одинаково","В эфирах разбирает работы мастеров и отвечает на вопросы салонов"].map(x=>`<span>${ic("check")}${x}</span>`).join("")}</div></div></div></section>
<section class="sec" id="slprice"><div class="wrap"><span class="kick">Тарифы</span><h2 class="hb">Платите за места, <em>а не за курсы</em></h2><p class="lead">Во всех тарифах — вся библиотека подписки, отработки с проверкой, эфиры и кабинет руководителя.</p><div class="slsl"><span>Сколько у вас мастеров?</span><input type="range" min="2" max="30" value="${Math.min(sv,30)}" oninput="slSeats(this.value)"><b id="slsv">${sv}</b><span class="sm mut">→ подойдёт <b id="slrt" style="color:var(--ch)">${SLPLAN[k][1]}${SLPLAN[k][0]?` · ${SLPLAN[k][0]} мест`:" · условия индивидуально"}</b></span></div><div class="slpr">${SLPLAN.map((p,j)=>`<div class="card slpl${j==k?" rec":""}"><span class="slrec">подходит вам</span>${p[3]?`<span class="pill t">${p[3]}</span>`:""}<h3>${p[1]}</h3><p class="sm mut">${p[2]}</p><div class="price">${p[0]?`X ₽<span>/мес</span>`:"Индивидуально"}</div><p class="xs mut">${p[0]?`${p[0]} мест · ≈ X ₽ за мастера`:"единый кабинет по всем точкам"}</p><a class="btn w ${j==k?"":"o"}" onclick="slGo(${p[0]||25},'${p[0]?"trial":"call"}')">${p[0]?"Попробовать 7 дней":"Обсудить условия"}</a></div>`).join("")}</div><p class="sm mut" style="margin-top:16px">Тариф расширяется в любой момент · оплата по счёту или картой · закрывающие документы каждый месяц</p></div></section>
<section class="sec g"><div class="wrap slfq"><div><span class="kick">Вопросы</span><h2 class="hb">Частые <em>вопросы</em></h2><p class="sm mut">Не нашли ответ — <a onclick="slGo()">оставьте заявку</a>, менеджер перезвонит.</p></div><div>${SLFAQ.map((q,i)=>`<details class="slq"${i?"":" open"}><summary>${q[0]}${ic("plus")}</summary><p class="sm mut">${q[1]}</p></details>`).join("")}</div></div></section>
<section class="sec"><div class="wrap"><div class="slfin"><div><h2 class="hb">Покажем кабинет руководителя <em>на примере вашего салона</em></h2><p>Созвон с менеджером: заведём ваших мастеров, назначим первый трек, ответим на вопросы.</p></div><div class="cta"><a class="btn xl" onclick="slGo()">Попробовать 7 дней бесплатно</a><a class="btn o xl" onclick="slGo(0,'call')">Заказать созвон</a></div></div></div></section></div>`};
const slChip=(g,v,t,on)=>`<button type="button" class="slch${on?" on":""}" data-g="${g}" data-v="${v}" onclick="slPick(this)">${t}</button>`;
function slPick(b){const g=b.dataset.g;document.querySelectorAll(`.slch[data-g="${g}"]`).forEach(x=>x.classList.toggle("on",x==b));S.ui["sl"+g]=b.dataset.v;save();if(g=="goal"){const i=document.getElementById("slinn");if(i)i.style.display=b.dataset.v=="bill"?"":"none";const s=document.getElementById("slsub");if(s)s.textContent=SLGOAL[b.dataset.v][1]}}
function slFormSeats(v){const k=slPlanFor(+v);const o=document.getElementById("slfp");if(o)o.innerHTML=`Подойдёт тариф <b>${SLPLAN[k][1]}</b>${SLPLAN[k][0]?` · ${SLPLAN[k][0]} мест`:" — условия обсудим"}`;S.ui.slseats=+v;save()}
const SLGOAL={trial:["Пробная неделя","Откроем доступ на 7 дней для всей команды"],call:["Созвон с демо","Покажем кабинет руководителя на вашем салоне"],bill:["Сразу счёт","Выставим счёт на юрлицо и подключим после оплаты"]};
function slSend(){const v=id=>(document.getElementById(id)||{}).value||"";if(!v("slfn").trim())return toast("Укажите название салона");if(!v("slfc").trim())return toast("Оставьте телефон или Телеграм — менеджер свяжется");if(!document.getElementById("slfa").checked)return toast("Без согласия на обработку данных отправить заявку нельзя");S.ui.slname=v("slfn").trim();save();go("#/salonform/ok")}
R.salonform=b=>{const goal=S.ui.slgoal||"trial",role=S.ui.slrole||"owner",seats=S.ui.slseats||7,k=slPlanFor(seats);
if(b=="ok"){const g=SLGOAL[goal];return`<div class="wrap"><div class="card slok"><span class="okc">${ic("check")}</span><span class="kick">Заявка отправлена</span><h1>${goal=="trial"?"Пробная неделя почти готова":goal=="bill"?"Готовим счёт":"Созвон назначим сегодня"}</h1><p class="lead">Салон «${S.ui.slname||"Ноготок"}» · ${g[0].toLowerCase()} · ${seats} мастеров</p><div class="slst v">${[["Менеджер свяжется","в рабочее время — по телефону или в Телеграме"],[goal=="bill"?"Счёт на юрлицо":"Заводим кабинет",goal=="bill"?"пришлём на почту, после оплаты сразу подключим":"салон, места и стартовый трек для мастеров"],["Приглашаем мастеров","каждый получит письмо и свой кабинет"]].map((s,i)=>`<div><span class="slno">${i+1}</span><span><b>${s[0]}</b><span class="sm mut">${s[1]}</span></span></div>`).join("")}</div><div class="cta"><a class="btn" onclick="demo('salon')">Пока посмотреть демо-кабинет</a><a class="btn o" onclick="go('#/salons')">Вернуться к программе</a></div></div></div>`}
return`<div class="wrap slform"><div class="card"><div class="bread"><a onclick="go('#/salons')">Для салонов</a>${ic("chev")}<span>Заявка</span></div><h1>Подключить салон</h1><p class="mut sm" id="slsub">${SLGOAL[goal][1]}</p><label class="l">Что вам удобнее</label><div class="slchs">${Object.keys(SLGOAL).map(g=>slChip("goal",g,SLGOAL[g][0],g==goal)).join("")}</div><label class="l">Вы в салоне</label><div class="slchs">${[["owner","Владелец"],["manager","Управляющий"],["admin","Администратор"]].map(r=>slChip("role",r[0],r[1],r[0]==role)).join("")}</div><div class="slg2"><div><label class="l">Название салона</label><input id="slfn" placeholder="Ноготок" value="${S.ui.slname||""}"></div><div><label class="l">Город</label><input placeholder="Москва"></div></div><label class="l">Сколько мастеров будут учиться</label><div class="slsl f"><input type="range" min="2" max="30" value="${Math.min(seats,30)}" oninput="document.getElementById('slfv').textContent=this.value+(this.value>=30?'+':'');slFormSeats(this.value)"><b id="slfv">${seats}</b></div><p class="sm mut" id="slfp" style="margin:0">Подойдёт тариф <b>${SLPLAN[k][1]}</b>${SLPLAN[k][0]?` · ${SLPLAN[k][0]} мест`:" — условия обсудим"}</p><div class="slg2"><div><label class="l">Ваше имя</label><input placeholder="Марина"></div><div><label class="l">Телефон или Телеграм</label><input id="slfc" placeholder="+7 … или @username"></div></div><div id="slinn" style="${goal=="bill"?"":"display:none"}"><label class="l">ИНН для счёта</label><input placeholder="7700000000"></div><label class="chk"><input type="checkbox" id="slfa"><span>Даю согласие на обработку персональных данных и принимаю <a>политику конфиденциальности</a></span></label><a class="btn w" onclick="slSend()">Отправить заявку</a></div><aside class="slfa"><h3>Что будет дальше</h3><div class="slst v">${[["Менеджер свяжется","в рабочее время"],["Подключим салон","заведём кабинет и мастеров"],["Мастера начнут учиться","вы увидите прогресс в кабинете"]].map((s,i)=>`<div><span class="slno">${i+1}</span><span><b>${s[0]}</b><span class="sm mut">${s[1]}</span></span></div>`).join("")}</div><hr><h3>В любом тарифе</h3><div class="slkl">${["Вся библиотека подписки","Отработки с проверкой","Эфиры с Катей","Замена мастеров в один клик","Счёт и акт на юрлицо"].map(x=>`<span>${ic("check")}${x}</span>`).join("")}</div></aside></div>`};
/* ---------- сертификат ---------- */
R.cert=id=>{const p=P[id]||P.kombi;return`<div class="wrap" style="padding:40px 16px 80px"><div class="cert card"><span class="kick">Логика маникюра</span><h1 style="margin:14px 0 6px">Сертификат</h1><p class="mut">подтверждает, что</p><h2 style="margin:10px 0">${S.name||"Имя Фамилия"}</h2><p class="mut">прошла курс, сдала отработки и итоговую аттестацию</p><h3 style="margin:14px 0">«${p.title}»</h3><div class="row" style="border:0;margin-top:20px"><span class="sm">Мастер: ${MS(by(p)).name}</span><span class="sm mut">№ LM-2026-0142 · проверить по QR</span></div></div><div style="text-align:center;margin-top:16px"><a class="btn" onclick="toast('PDF скачан (прототип)')">${ic("dl")} Скачать PDF</a> <a class="btn o" onclick="toast('Ссылка скопирована')">Поделиться</a></div></div>`};

/* ---------- кабинет мастера-партнёра ---------- */
const PRG=(k,role,b)=>S.pro==role?cab(k,b):`<div class="wrap"><div class="form card" style="text-align:center"><h3>Кабинет ${role=="master"?"мастера-партнёра":"UGC-креатора"}</h3><p class="sm mut" style="margin:8px 0 14px">Посмотреть, как он устроен</p><a class="btn" onclick="demo('${role}')">Войти как ${role=="master"?"мастер":"креатор"}</a></div></div>`;
const kpi=a=>`<div class="kpi" style="margin-bottom:24px">${a.map(x=>`<div class="card"><span class="sm mut">${x[0]}</span><b>${x[1]}</b>${x[2]?`<span class="pill ${x[3]||"g"}">${x[2]}</span>`:""}</div>`).join("")}</div>`;
const tbl=(h,rows)=>`<div class="card tblw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const pill=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const bars=a=>`<div class="card"><h3 style="margin-bottom:12px">${a[0]}</h3>${a[1].map(r=>`<div style="display:grid;grid-template-columns:150px 1fr 50px;gap:12px;align-items:center;padding:7px 0;font-size:14px"><span>${r[0]}</span>${bar(r[1],a[2])}<b>${r[1]}</b></div>`).join("")}</div>`;
const payouts=()=>tbl(["Дата","Сумма","Статус","Документ"],[["20.09","X ₽",pill("g","выплачено"),`<a onclick="toast('Чек НПД (прототип)')">чек</a>`],["05.09","X ₽",pill("g","выплачено"),`<a onclick="toast('Чек НПД (прототип)')">чек</a>`],["23.09","X ₽",pill("y","к выплате"),"—"]]);
R.pro=()=>PRG("pro","master",`<div class="ph"><div><h1>Добрый день, ${(S.name||"").split(" ")[0]}</h1><p class="mut">Сентябрь · ваши атомы и курсы</p></div><a class="btn s" onclick="go('#/pro/new')">${ic("plus")} Загрузить атом</a></div>${kpi([["Продажи за месяц","X ₽","+12%"],["Новых учеников","38","+9"],["Рейтинг","★ 4.8"],["К выплате","X ₽"]])}<div class="home"><div class="col">${bars(["Продажи по неделям",[["1–7 сент",14],["8–14 сент",19],["15–21 сент",23],["22–28 сент",9]],25])}${tbl(["Продукт","Продаж","Оценка","Статус"],[[P.al1.title,"64","4.9 ★",pill("g","опубликован")],[P.al2.title,"12","4.8 ★",pill("g","опубликован")],["Миндаль на коротких ногтях","—","—",pill("y","на модерации")]])}</div><aside class="col side"><div class="card"><h4>Деньги</h4><p class="sm">Баланс: <b>X ₽</b></p><p class="sm mut" style="margin:6px 0 10px">Комиссия платформы X % удерживается автоматически</p><a class="lnk sm" onclick="go('#/pro/money')">Выплаты и документы ${ic("chev")}</a></div><div class="card"><h4>Ближайший эфир</h4><p class="sm">Квадрат на коротких: живой разбор · 23 окт</p><a class="lnk sm" onclick="go('#/pro/live')">Все эфиры ${ic("chev")}</a></div><div class="card"><h4>Новые отзывы <span class="pill t">3</span></h4><p class="sm mut">Ответьте — это поднимает рейтинг</p><a class="lnk sm" onclick="go('#/pro/students')">Открыть ${ic("chev")}</a></div></aside></div>`);
R["pro/courses"]=()=>PRG("pro/courses","master",`<div class="ph"><div><h1>Курсы и атомы</h1><p class="mut">Перед публикацией каждый продукт проходит модерацию</p></div><a class="btn s" onclick="go('#/pro/new')">${ic("plus")} Загрузить</a></div>${tbl(["Название","Тип","Цена","Продаж","Статус",""],[[P.al1.title,"Атом","199 ₽","64",pill("g","опубликован"),`<a onclick="toast('Редактор (прототип)')">изменить</a>`],[P.al2.title,"Курс","X ₽","12",pill("g","опубликован"),`<a onclick="toast('Редактор (прототип)')">изменить</a>`],["Миндаль на коротких ногтях","Атом","99 ₽","—",pill("y","на модерации"),"—"],["Блики и апекс: разбор ошибок","Атом","—","—",pill("","черновик"),`<a onclick="go('#/pro/new')">дописать</a>`]])}<div class="card" style="margin-top:20px"><h3 style="margin-bottom:6px">Атомы собираются в курс</h3><p class="sm mut">Ученик, купивший атомы курса, доплачивает только разницу до полного курса.</p></div>`);

function biStack(el,id,sp){const W=el.clientWidth,H=sp.h||230,m={l:46,r:12,t:14,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b,n=sp.x.length;if(iw<40)return;
